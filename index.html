<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#f1f0ea; --text:#12263f; --muted:#5b6676;
  --border:#dedcd3; --brand:#0b2636; --accent:#3f7f66; --accent-weak:#e4efe9; --gold:#a08a5a;
  --ok:#2e7d4f; --ok-weak:#e6f3eb; --warn:#9a6a00; --warn-weak:#fdf4dc; --bad:#b3261e; --bad-weak:#fbeae8;
  --chart-line:#3f7f66; --chart-fill:rgba(63,127,102,.12); --grid:#e7e5dd;
  --s-in:#2f8c64; --s-res:#3f6fb5; --s-out:#c0832a; --s4:#8a5cb8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1726; --surface:#12223a; --surface-2:#192c47; --text:#e8eef5; --muted:#9fb0c4;
    --border:#243a57; --accent:#7fbfa3; --accent-weak:#173a33; --gold:#c9a96e;
    --ok:#5cc08a; --ok-weak:#123326; --warn:#e0ae3c; --warn-weak:#33290f; --bad:#f2786d; --bad-weak:#3a1a1a;
    --chart-line:#7fbfa3; --chart-fill:rgba(127,191,163,.14); --grid:#22364f;
    --s-in:#4fa880; --s-res:#5f8bd0; --s-out:#bd8028; --s4:#a07fd6;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1726; --surface:#12223a; --surface-2:#192c47; --text:#e8eef5; --muted:#9fb0c4;
  --border:#243a57; --accent:#7fbfa3; --accent-weak:#173a33; --gold:#c9a96e;
  --ok:#5cc08a; --ok-weak:#123326; --warn:#e0ae3c; --warn-weak:#33290f; --bad:#f2786d; --bad-weak:#3a1a1a;
  --chart-line:#7fbfa3; --chart-fill:rgba(127,191,163,.14); --grid:#22364f;
  --s-in:#4fa880; --s-res:#5f8bd0; --s-out:#bd8028; --s4:#a07fd6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1872px;margin:0 auto;padding:0 16px}

/* Cabeçalho da marca */
.brandbar{background:var(--brand);color:#fff}
.brandbar .wrap{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{height:64px;width:auto;flex:0 0 auto;border-radius:10px;display:block}
.brandbar h1{margin:0;font-size:22px;letter-spacing:.2px}
.brandbar p{margin:2px 0 0;color:#c8d3e0;font-size:13px}
.brandbar .actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.brandbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.brandbar .btn:hover{background:rgba(255,255,255,.1)}
.brandbar .btn.primary{background:#7fbfa3;color:#10223a;border-color:#7fbfa3;font-weight:600}

/* Herói */
.hero{margin:16px auto 0}
.verdict{border-radius:12px;padding:9px 14px;border:1px solid;display:flex;gap:10px;align-items:center}
.verdict .ic{font-size:18px;line-height:1}
.verdict>div:last-child{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;line-height:1.35}
.verdict b{font-size:16px}
.verdict span{color:var(--muted);font-size:13.5px}
.bigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}
@media (max-width:900px){.bigs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.bigs{grid-template-columns:1fr}}
.big{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px 12px 4px}
.big .q{font-size:12px;color:var(--muted);line-height:1.2}
.big .a{font-size:19.5px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.1}
.big .a .de{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.big .d{font-size:12px;color:var(--muted);line-height:1.35}
.meter{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:4px 0 3px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* Layout principal */
main.wrap{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px;padding-bottom:48px}
main.wrap>*{min-width:0}
@media (max-width:1000px){main.wrap{grid-template-columns:minmax(0,1fr)}}
#inputs{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding-right:4px}
@media (max-width:1000px){#inputs{position:static;max-height:none;overflow:visible}}
.side-head{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.side-head h2{margin:0 0 4px;font-size:16px}
.side-head p{margin:0 0 10px;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.changed-note{font-size:12px;color:var(--muted);margin-top:8px}

details.grp{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.grp>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;align-items:center;gap:10px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .t{font-weight:650}
details.grp>summary .s{display:block;font-size:12px;color:var(--accent);font-weight:500}
details.grp>summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.grp[open]>summary::after{content:"－"}
.gintro{margin:0 14px 6px;font-size:13px;color:var(--muted)}
.field{padding:10px 14px;border-top:1px solid var(--border)}
.field .row{display:flex;align-items:center;gap:10px}
.field label{flex:1;font-weight:550;font-size:14px}
.field .inp{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.field input,.field select{width:118px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;text-align:right}
.field select{width:190px;text-align:left}
.field .u{font-size:12px;color:var(--muted);min-width:44px}
.field .help{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.field.changed input,.field.changed select{border-color:var(--warn);background:var(--warn-weak)}
.field .reset{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;margin-top:3px;display:none}
.field.changed .reset{display:inline}
.field.hidden,.field.adv-hidden{display:none}

/* Abas */
/* Abas: barra própria, fixa no topo ao rolar, com ícones (diferente dos botões de cenário) */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px;padding:5px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:14px;box-shadow:0 3px 10px rgba(11,38,54,.10);position:sticky;top:8px;z-index:20}
.tabs button{flex:1 1 auto;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;border-radius:10px;padding:14px 9px;cursor:pointer;color:var(--text);font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;transition:background .15s,color .15s}
.tabs button svg{width:17px;height:17px;flex:0 0 auto;color:var(--accent)}
.tabs button:hover{background:var(--accent-weak);color:var(--text)}
.tabs button.on{background:var(--brand);color:#fff;box-shadow:inset 0 -3px 0 #7fbfa3}
.tabs button.on svg{color:#7fbfa3}
:root[data-theme="dark"] .tabs button.on{background:var(--accent);color:#0b1726;box-shadow:inset 0 -3px 0 #0b2636}
:root[data-theme="dark"] .tabs button.on svg{color:#0b1726}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button.on{background:var(--accent);color:#0b1726;box-shadow:inset 0 -3px 0 #0b2636}
  :root:not([data-theme="light"]) .tabs button.on svg{color:#0b1726}}
@media (max-width:700px){.tabs{display:flex;overflow-x:auto;top:0;border-radius:0 0 12px 12px;scrollbar-width:thin}
  .tabs button{flex:0 0 auto;padding:10px 12px;font-size:14px}}
.tab{display:none}.tab.on{display:block}
/* Teclado (E3): contorno visível em tudo que recebe foco pelo teclado */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brandbar :focus-visible{outline-color:#7fbfa3}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab:focus-visible{outline:2px dashed var(--accent);outline-offset:4px;border-radius:14px}
/* Aba Sócios e matriz de riscos */
small.ex{color:var(--gold);font-weight:500;font-size:11.5px}
.rmat{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:4px;font-size:12.5px;margin:6px 0 12px}
.rmat>div{border-radius:8px;padding:6px 8px;min-height:36px}
.rmat .h{color:var(--muted);font-weight:600;display:flex;align-items:center}
.rmat .c1{background:var(--ok-weak)}.rmat .c2{background:var(--warn-weak)}.rmat .c3{background:var(--bad-weak)}
.rmat b{display:inline-block;min-width:24px;text-align:center;border-radius:999px;background:var(--surface);border:1px solid var(--border);margin:2px;font-size:12px}
.dil select{min-width:140px}
table.txt td,table.txt th{text-align:left;white-space:normal}table.txt td.n{white-space:nowrap}
.indbox table td{padding:5px 6px}
/* Rodapé com a versão (E1) */
.rodape{color:var(--muted);font-size:12.5px;padding-bottom:28px}
.rodape p{margin:0;border-top:1px solid var(--border);padding-top:12px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 2px;font-size:16px}
.card .sub{margin:0 0 10px;color:var(--muted);font-size:13px}
.alert{border-radius:10px;padding:9px 12px;margin:7px 0;font-size:14px;border:1px solid;display:flex;gap:8px}
.bad{background:var(--bad-weak);border-color:var(--bad)}
.warn{background:var(--warn-weak);border-color:var(--warn)}
.ok{background:var(--ok-weak);border-color:var(--ok)}
.neg{color:var(--bad)} .pos{color:var(--ok)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-weight:600;font-size:12.5px}
tr.total td{font-weight:700;border-top:2px solid var(--border)}
tr.hl td{background:var(--accent-weak)}
table.qfat th{text-align:right;line-height:1.25}table.qfat th:first-child{text-align:left}table.qfat th small,table.qfat td small{font-weight:400;color:var(--muted)}
table.qfat td.atual{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
tr.sub td{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}

.indgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.indbox h4{margin:0 0 6px;font-size:14px;color:var(--accent)}
.ind{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.ind .l{font-size:13.5px}
.ind .l small{display:block;color:var(--muted);font-size:12px}
.ind .v{font-weight:650;text-align:right;white-space:nowrap}

.hbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 110px;gap:10px;align-items:center;padding:4px 0;font-size:13.5px}
.hbar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--chart-line);border-radius:0 4px 4px 0}
.hbar .val{text-align:right;color:var(--muted)}

.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none;white-space:nowrap}
.legend-inline{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.gloss dt{font-weight:650;margin-top:8px}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.pl{font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.presets button:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0b2636;color:#fff;padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;font-size:14px;max-width:92vw}
.toast button{background:#7fbfa3;color:#0b2636;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600}
.cen-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.cen-row .n{flex:1;min-width:0}.cen-row .n small{display:block;color:var(--muted);font-size:11.5px}
.cen-row button{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
.cen-form{display:flex;gap:6px}.cen-form input{flex:1;min-width:0}
.cen-atual{font-size:12.5px;color:var(--accent);margin-top:6px}
</style>
</head>

const MODELS = {seminovos:"Comprar seminovos", novos:"Comprar novos à vista", leasing:"Alugar (leasing)", cdc:"Financiar novos (CDC)"};
const SIMPLES_MODES = {auto:"Automático (Anexo III ou V pelo Fator R)", manual:"Manual (% fixo)"};
const GROWTH_MODES = {linear:"Linha reta até a meta", curvaS:"Curva em S até a meta", captacao:"Por captação mensal (novos − cancelamentos)"};
const YESNO = {sim:"Sim", nao:"Não"};
const VINCULOS = {clt:"CLT ou autônomo (pessoa física)", pj:"MEI ou empresa (PJ)"};
const SELECTS = {modelo: MODELS, modoSimples: SIMPLES_MODES, modoCrescimento: GROWTH_MODES, limitarVagas: YESNO, vinculoInstr: VINCULOS};
const FIELDS = {}; GROUPS.forEach(g => g.f.forEach(f => FIELDS[f[0]] = {l:f[1], u:f[2], v:f[3], st:f[4], h:f[5], e:f[6], g:g.id}));
const DEFAULTS = {}; Object.keys(FIELDS).forEach(k => DEFAULTS[k] = FIELDS[k].v);
// Limites de cada campo (à prova de erros): nada negativo, horas de 0 a 24, partes de um todo até 100%,
// prazos até 30 anos (períodos enormes travariam a tela) e nenhum valor absurdo.
function limites(id){
  const u = FIELDS[id].u;
  if(u==="h") return [0, 24];
  if(u==="dias") return [0, 31];
  if(u==="anos") return [0, 50];
  if(/^meses/.test(u)) return [0, 360];
  if(u==="% ao ano" || (u==="% ao mês" && id!=="churn")) return [0, 1000];
  if(u.includes("%")) return [0, 100];
  return [0, 1e9];
}
// Prazos em meses usados mês a mês são inteiros (o motor e as tabelas usam o mesmo valor)
const MESES_INTEIROS = ["mesesObra","carencia","leasingPrazo","cdcPrazo","empPrazo","empCarencia","horizonte"];
const limitar = (id, v) => { const [a, b] = limites(id), x = Math.min(b, Math.max(a, v)); return MESES_INTEIROS.includes(id) ? Math.round(x) : x; };
// Versão (E1). Ao mudar qualquer valor padrão: atualize "padroes" com a data, registre no Contexto.md e no teste do código.
// Ao publicar uma versão nova do simulador: atualize "app". O código muda sozinho quando algum padrão muda.
function assinaturaPadroes(){
  const t = JSON.stringify(Object.keys(DEFAULTS).sort().map(k => [k, DEFAULTS[k]]));
  let h = 2166136261; for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h>>>0).toString(16).padStart(8,"0").slice(0,6);
}
const VERSAO = {app:"1.4.0", padroes:"15-11-2026", codigo: assinaturaPadroes()};
const textoVersao = () => `Simulador ${VERSAO.app} · valores padrão de ${VERSAO.padroes} (código ${VERSAO.codigo})`;

const UI = loadUI();
let P = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s) return sanitize(s); }catch(e){} return {...DEFAULTS}; }
// Aceita só chaves conhecidas, opções válidas e números finitos (texto numérico também); o resto volta ao padrão
function sanitize(o){
  const r = {...DEFAULTS}, tem = (obj, k) => Object.prototype.hasOwnProperty.call(obj, k);
  if(!o || typeof o !== "object") return r;
  for(const k in DEFAULTS){ if(!tem(o, k)) continue; const v = o[k];
    if(SELECTS[k]){ if(typeof v === "string" && tem(SELECTS[k], v)) r[k] = v; continue; }
    const n = typeof v === "number" ? v : (typeof v === "string" && v.trim() !== "" ? +v.replace(",", ".") : NaN);
    if(Number.isFinite(n)) r[k] = limitar(k, n);
  }
  return r;
}

function loadUI(){ try{ return {tab:"resumo", modo:"essencial", ...JSON.parse(localStorage.getItem(STORE_KEY+"-ui")||"{}")}; }catch(e){ return {tab:"resumo", modo:"essencial"}; } }

const fin = v => Number.isFinite(v) ? v : 0;
const brl = v => fin(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brl2 = v => fin(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2});
const num = (v,d=0) => fin(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=1) => !Number.isFinite(v) ? "—" : (v > 99.99 ? "mais de 9.999%" : num(v*100,d)+"%");
const sgn = v => `<span class="${v<0?'neg':'pos'}">${brl(v)}</span>`;
const pmt = (pv,i,n) => n<=0 ? 0 : (!i ? pv/n : pv*i/(1-Math.pow(1+i,-n)));
const anosTxt = H => H%12===0 ? (H===12 ? "1 ano" : `${H/12} anos`) : `${num(H/12,1)} anos`;
const tempo = m => m===null ? "não se paga" : (m===1 ? "1 mês" : m<12 ? `${m} meses` : `${m} meses (${num(m/12,1)} anos)`);

// ================= Motor de cálculo =================
function deriv(p){
  const h = (a,b) => Math.max(0, b-a);
  const horasOp = h(p.abreSemana,p.fechaSemana)*p.diasUteis + h(p.abreSab,p.fechaSab)*p.sabados + h(p.abreDom,p.fechaDom)*p.domingos;
  const capSim = Math.max(0, Math.round(p.capSim));
  const areaNec = capSim*p.m2Aluno; // área de treino necessária para a turma
  const vagas = horasOp*capSim;
  // B4: treinos contratados pelo mix (semanas por mês = 52/12) menos as faltas
  const freqSem = (p.m2*2 + p.m3*3 + p.m45*p.freq45)/100;
  const aulasContratadas = freqSem*52/12;
  const aulasMes = aulasContratadas*(1 - p.faltas/100);
  const lotacao = aulasMes>0 ? Math.floor(vagas/aulasMes*p.fatorOcup/100) : 0;
  const mixSum = p.m2+p.m3+p.m45;
  const ticketBruto = (p.m2*p.p2+p.m3*p.p3+p.m45*p.p45)/100;
  const ticket = ticketBruto*(1-p.pctLongo/100*p.descLongo/100)*(1-p.inadimpl/100);
  const tecnica = (horasOp*p.instrBase + p.horasPico2)*p.custoHoraInstr + p.adicRT;
  const capLinhas = p.capObraCivil+p.capEletrica+p.capHidraulica+p.capClima+p.capPiso+p.capAcess+p.capProjeto+p.capLicencas+p.capMobiliario+p.capTI+p.capMktPre;
  const capexObra = (p.capexNaoDet + capLinhas)*(1+p.contingencia/100);
  const folha = tecnica + p.apoio + p.proLabore;
  const outrosFixos = p.condIptu+p.taxasPrediais+p.garantia+folha+p.utilidades+p.marketing+p.software+p.contador+p.seguro+p.residuos+p.outros;
  const horasSala = horasSalas(p);
  const capArea = p.m2Aluno>0 ? Math.floor(p.areaUtilTerreo/p.m2Aluno) : 0; // alunos que cabem na área estimada (A9)
  const lotArea = aulasMes>0 ? Math.floor(horasOp*capArea/aulasMes*p.fatorOcup/100) : 0;
  return {horasOp, capSim, areaNec, vagas, lotacao, mixSum, ticketBruto, ticket, tecnica, folha, capexObra, outrosFixos, horasSala, capArea, lotArea, freqSem, aulasContratadas, aulasMes};
}
// Horas por mês em que cada sala pode ser alugada (A10): horário próprio das salas × dias do studio
function horasSalas(p){
  const h = (a,b) => Math.max(0, b-a);
  return h(p.abreSalaSemana,p.fechaSalaSemana)*p.diasUteis + h(p.abreSalaSab,p.fechaSalaSab)*p.sabados + h(p.abreSalaDom,p.fechaSalaDom)*p.domingos;
}
// Simples Nacional (LC 123/2006, redação da LC 155/2016). Academias e "administração e locação de imóveis de terceiros"
// (art. 18, § 5º-D) pagam pelo Anexo III se a folha dos 12 meses for ≥ 28% da receita (Fator R, §§ 5º-J e 5º-M); abaixo, Anexo V.
// Tabelas: [teto da faixa de receita em 12 meses, alíquota nominal, parcela a deduzir]
const ANEXO_III = [[180000,0.06,0],[360000,0.112,9360],[720000,0.135,17640],[1800000,0.16,35640],[3600000,0.21,125640],[4800000,0.33,648000]];
const ANEXO_V   = [[180000,0.155,0],[360000,0.18,4500],[720000,0.195,9900],[1800000,0.205,17100],[3600000,0.23,62100],[4800000,0.305,540000]];
const FATOR_R_MIN = 0.28;
function simplesEfetivo(rbt12, anexo = "III"){
  const T = anexo==="V" ? ANEXO_V : ANEXO_III;
  if(!(rbt12>0)) return T[0][1];
  const f = T.find(x => rbt12 <= x[0]) || T[T.length-1];
  return (rbt12*f[1] - f[2]) / rbt12;
}
// Folha que conta no Fator R: salários e encargos de pessoas físicas + pró-labore (pagamentos a MEI/PJ não contam)
function folhaFatorR(p, d){ return (p.vinculoInstr==="pj" ? 0 : d.tecnica) + p.apoio + p.proLabore; }
// Taxas aplicadas: studio = Simples + cartão; salas = Simples (automático) ou % manual
function taxas(p, rbt12, fatorR = Infinity){
  if(p.modoSimples==="manual") return {simp: p.tSimples/100, tT: (p.tSimples+p.tCartao)/100, tC: p.tCow/100, anexo: "manual", fatorR};
  const anexo = fatorR >= FATOR_R_MIN ? "III" : "V";
  const simp = simplesEfetivo(rbt12, anexo);
  return {simp, tT: simp + p.tCartao/100, tC: simp, anexo, fatorR};
}
function equip(p, m){
  switch(m){
    case "novos": return {capex:p.novosValor, opex:()=>p.novosManut, oneoff:()=>0, label:"manutenção dos aparelhos"};
    case "leasing": return {capex:0,
      opex:k => (p.leasingPrazo>0 && k>p.leasingPrazo) ? p.novosManut : p.leasingAluguel,
      oneoff:k => (p.leasingPrazo>0 && k===p.leasingPrazo+1) ? p.novosValor*p.leasingVRG/100 : 0, label:"aluguel dos aparelhos"};
    case "cdc": { if(!(p.cdcPrazo>0)) return {capex:p.novosValor, opex:()=>p.novosManut, oneoff:()=>0, parcela:0, label:"manutenção dos aparelhos (sem parcelas: à vista)"};
      const ent = Math.min(p.cdcEntrada, p.novosValor), parc = pmt(p.novosValor-ent, p.cdcTaxa/100, p.cdcPrazo);
      return {capex:ent, opex:k => (k<=p.cdcPrazo ? parc : 0) + p.novosManut, oneoff:()=>0, parcela:parc, label:"parcela + manutenção dos aparelhos"}; }
    default: return {capex:p.seminovosValor, opex:()=>p.seminovosManut, oneoff:()=>0, label:"manutenção dos aparelhos"};
  }
}
function cow(p, ocup, priceF=1, tC=p.tCow/100, costF=1){
  const sf = Math.min(Math.max(p.salasFixas,0), p.salas), sh = Math.max(0, p.salas - sf);
  const horas = Math.round(horasSalas(p)*Math.min(100, Math.max(0, ocup))/100);
  const pa = p.pctAvulsa/100, pt = p.pctTurno/100, pp = Math.max(0, 1-pa-pt);
  const precoMed = (p.precoHora*pp + p.precoAvulsa*pa + p.precoTurno*pt)*priceF;
  const recHora = sh*horas*precoMed, recFixo = sf*p.aluguelFixoSala*priceF, rec = recHora+recFixo;
  const imp = rec*tC, plat = recHora*p.comissaoPlat/100, vari = sh*horas*p.custoVarHora*costF;
  return {sh, horas, precoMed, recSala:horas*precoMed, recHora, recFixo, rec, imp, plat, vari, liq:rec-imp-plat-vari};
}
function loanPay(p, m){
  if(p.empValor<=0) return 0;
  const i = p.empTaxa/100;
  if(m<=p.empCarencia) return p.empValor*i;
  if(p.empPrazo<=0) return m===p.empCarencia+1 ? p.empValor*(1+i) : 0; // sem parcelas: devolve tudo de uma vez
  if(m<=p.empCarencia+p.empPrazo) return pmt(p.empValor, i, p.empPrazo);
  return 0;
}
// B1/B3: alunos em regime. Linha reta e curva em S: a meta. Captação: novos ÷ cancelamento (base estável);
// sem cancelamento, a base cresce até o fim da análise. Com "limitar às vagas", nunca passa da lotação.
function alunosRegime(p, d, limitar = p.limitarVagas==="sim"){
  let A;
  if(p.modoCrescimento==="captacao"){
    const ch = p.churn/100, meses = Math.max(1, Math.max(12, Math.round(p.horizonte)) - Math.round(p.mesesObra));
    A = ch>0 ? p.novosMes/ch : p.alunosIniciais + p.novosMes*meses;
  } else A = p.alunosAlvo;
  return limitar ? Math.min(A, d.lotacao) : A;
}
// B1/B2/B3: alunos no mês k de funcionamento
function alunosNoMes(p, d, k, anterior){
  const teto = p.limitarVagas==="sim" ? d.lotacao : Infinity;
  if(p.modoCrescimento==="captacao"){
    const base = k===1 ? p.alunosIniciais : anterior;
    return Math.min(teto, base*(1 - p.churn/100) + p.novosMes);
  }
  const x = p.rampa>0 ? Math.min(1, k/p.rampa) : 1;
  const f = p.modoCrescimento==="curvaS" ? x*x*(3 - 2*x) : x; // curva em S: começo e fim mais lentos
  return Math.min(teto, Math.min(p.alunosAlvo, p.alunosIniciais + (p.alunosAlvo - p.alunosIniciais)*f));
}
// Usado nas tabelas que testam um nº de alunos específico
function comAlunos(p, n, extra){ return {...p, ...(extra||{}), alunosAlvo: n, modoCrescimento: p.modoCrescimento==="captacao" ? "linear" : p.modoCrescimento}; }
// Resultado de um mês "maduro" com A alunos (preços e custos do 1º ano)
function regimeCore(p, modelo, A, d, eq){
  const ch = p.churn/100, novos = A*ch;
  const recPlanos = A*d.ticket, recMat = novos*p.matricula, recT = recPlanos+recMat+p.recExtra;
  const c0 = cow(p, p.ocupCow);
  const receitaMes = recT + c0.rec;
  const tx = taxas(p, 12*receitaMes, receitaMes>0 ? folhaFatorR(p, d)/receitaMes : Infinity);
  const c = cow(p, p.ocupCow, 1, tx.tC);
  const eqOp = eq.opex(1), opex = p.aluguel + d.outrosFixos + eqOp;
  const impT = recT*tx.tT, cvar = A*p.cvAluno + novos*p.cac;
  const resultado = recT - impT - cvar + c.liq - opex;
  return {c, tx, eqOp, opex, A, novos, recPlanos, recMat, recT, impT, cvar, resultado};
}
// Menor nº de alunos com resultado mensal ≥ alvo (Infinity se nenhum). Varre de 1 em 1, porque o resultado nem sempre
// cresce com os alunos: com mais faturamento o Simples muda de faixa e, pelo Fator R, pode passar ao Anexo V.
// Acima de 1.000 alunos (ou 2× as vagas), busca binária até 20.000.
function minAlunos(p, modelo, alvo, d, eq){
  const res = N => regimeCore(p, modelo, N, d, eq).resultado;
  const L = Math.min(20000, Math.max(1000, 2*d.lotacao));
  for(let N=0; N<=L; N++) if(res(N) >= alvo) return N;
  let lo = L+1, hi = 20000;
  if(lo > hi || res(hi) < alvo) return Infinity;
  while(lo < hi){ const mid = Math.floor((lo+hi)/2); if(res(mid) >= alvo) hi = mid; else lo = mid+1; }
  return lo;
}
function regime(p, modelo){
  const d = deriv(p), eq = equip(p, modelo);
  const r = regimeCore(p, modelo, alunosRegime(p, d), d, eq);
  d.tT = r.tx.tT; d.tC = r.tx.tC; d.tSimp = r.tx.simp; d.anexo = r.tx.anexo; d.fatorR = r.tx.fatorR; d.folhaR = folhaFatorR(p, d);
  const ch = p.churn/100;
  const margAluno = d.ticket*(1-d.tT) - p.cvAluno + ch*(p.matricula*(1-d.tT) - p.cac);
  const fixoLiq = r.opex - r.c.liq - p.recExtra*(1-d.tT);
  // Break-even: menor nº de alunos com resultado ≥ 0, recalculando o Simples em cada faturamento
  const be = minAlunos(p, modelo, 0, d, eq);
  // Lucro depois de quitar os aparelhos (A5): CDC após o prazo; leasing com prazo após a compra
  const kPos = modelo==="cdc" && p.cdcPrazo>0 ? p.cdcPrazo+1 : (modelo==="leasing" && p.leasingPrazo>0 ? p.leasingPrazo+1 : null);
  const resultadoPos = kPos ? r.resultado + r.eqOp - eq.opex(kPos) : null;
  return {...r, d, eq, margAluno, fixoLiq, be, kPos, resultadoPos, receitaTotal: r.recT + r.c.rec};
}
const MONTH_FIELDS = ["mesesObra","carencia","leasingPrazo","cdcPrazo","empPrazo","empCarencia","horizonte"];
function intMonths(p){ const q = {...p}; MONTH_FIELDS.forEach(k => q[k] = Math.max(0, Math.round(q[k]))); return q; }
function simulate(p0, modelo){
  const p = intMonths(p0);
  const r = regime(p, modelo), d = r.d, eq = r.eq;
  const capexTotal = d.capexObra + eq.capex;
  const upfront = capexTotal + p.luvas + p.caucao*p.aluguel;
  const im = Math.pow(1+p.tma/100, 1/12) - 1;
  const H = Math.max(12, p.horizonte);
  const flows = [-upfront];
  let cumProj = -upfront, cumSoc = -upfront + p.empValor, minSoc = cumSoc, minMes = 0, dcum = -upfront;
  let payback = null, paybackDesc = null, prevA = 0, mesLucro = null, mesesNeg = 0, mesesAnexoV = 0;
  const rows = [], recHist = [], folHist = [];
  for(let m=1; m<=H; m++){
    const yA = Math.floor((m-1)/12);
    const alug = m<=p.carencia ? 0 : p.aluguel*Math.pow(1+p.reajAluguel/100, yA);
    let proj, row;
    if(m<=p.mesesObra){
      proj = -(alug + p.condIptu + p.taxasPrediais + p.garantia);
      row = {m, fase:"Obra", alunos:null, receita:0, recStudio:0, recSalas:0};
    } else {
      const k = m - p.mesesObra, y = Math.floor((k-1)/12);
      const fP = Math.pow(1+p.reajPreco/100, y), fC = Math.pow(1+p.inflCustos/100, y);
      const A = alunosNoMes(p, d, k, prevA);
      const novos = Math.max(0, A - prevA*(1 - p.churn/100)); prevA = A;
      const fCow = p.rampaCow>0 ? Math.min(1, k/p.rampaCow) : 1;
      const recT = A*d.ticket*fP + novos*p.matricula*fP + p.recExtra*fP;
      const c0 = cow(p, p.ocupCow*fCow, fP);
      // Receita bruta dos 12 meses anteriores; no início da atividade, média dos meses anteriores × 12 (no 1º mês, o próprio mês × 12)
      const prev = recHist.slice(-12), prevF = folHist.slice(-12), soma = a => a.reduce((x,y)=>x+y,0);
      const folhaMes = folhaFatorR(p, d)*fC;
      const rbt12 = prev.length===0 ? (recT + c0.rec)*12 : (prev.length<12 ? soma(prev)/prev.length*12 : soma(prev));
      // Fator R: folha ÷ receita dos 12 meses anteriores (no 1º mês, os valores do próprio mês)
      const fr = prev.length===0 ? (recT + c0.rec > 0 ? folhaMes/(recT + c0.rec) : Infinity) : (soma(prev) > 0 ? soma(prevF)/soma(prev) : Infinity);
      const tx = taxas(p, rbt12, fr);
      const c = cow(p, p.ocupCow*fCow, fP, tx.tC, fC);
      recHist.push(recT + c.rec); folHist.push(folhaMes);
      const custos = alug + d.outrosFixos*fC + eq.opex(k) + eq.oneoff(k) + (A*p.cvAluno + novos*p.cac)*fC;
      proj = recT*(1-tx.tT) + c.liq - custos;
      row = {m, k, fase:"Funcionando", alunos:A, receita:recT + c.rec, recStudio:recT, recSalas:c.rec, simp:tx.simp, anexo:tx.anexo, fatorR:fr};
      if(proj<0) mesesNeg++;
      if(tx.anexo==="V") mesesAnexoV++;
      if(mesLucro===null && proj>=0) mesLucro = k;
    }
    const soc = proj - loanPay(p, m);
    cumProj += proj; cumSoc += soc;
    if(cumSoc < minSoc){ minSoc = cumSoc; minMes = m; }
    dcum += proj/Math.pow(1+im, m);
    flows.push(proj);
    if(row.k && payback===null && cumProj>=0) payback = row.k;
    if(row.k && paybackDesc===null && dcum>=0) paybackDesc = row.k;
    rows.push({...row, proj, soc, cumProj, cumSoc});
  }
  const last12 = flows.slice(-12).reduce((a,b)=>a+b,0);
  const residual = p.multSaida>0 ? Math.max(0, last12)*p.multSaida : 0;
  const caucaoVal = p.caucao*p.aluguel;
  // No fim: venda (se houver), caução de volta e saldo do financiamento dos aparelhos ainda a pagar
  const cdcFim = saldoCDC(p, H, modelo), dividasFim = dividasNoMes(p, H, modelo);
  const flowsR = flows.slice(); flowsR[flowsR.length-1] += residual + caucaoVal - cdcFim;
  const vpl = flowsR.reduce((s,f,i)=> s + f/Math.pow(1+im,i), 0);
  const pvFut = flowsR.slice(1).reduce((s,f,i)=> s + f/Math.pow(1+im,i+1), 0);
  const reserva = Math.max(0, p.reservaMeses)*r.opex;
  return {...r, p, capexTotal, upfront, payback, paybackDesc, exposicao: Math.max(0,-minSoc), reserva, capitalRec: Math.max(0,-minSoc) + reserva, minMes, vpl, tir: irr(flowsR),
          il: upfront>0 ? pvFut/upfront : null, rows, H, mesLucro, mesesNeg, mesesAnexoV, residual, caucaoVal, dividasFim, cumFinal: cumSoc + residual + caucaoVal - dividasFim};
}
// D8: alunos e faturamento por ano, com anos contados da assinatura do contrato (o ano 1 inclui a obra).
// Faturamento = mensalidades (já com descontos e inadimplência) + matrículas + outras receitas + salas, antes de impostos.
function resumoAnual(s){
  const anos = [];
  for(let i=0; i<s.rows.length; i+=12){
    const rs = s.rows.slice(i, i+12), abertos = rs.filter(r => r.k), fim = rs[rs.length-1];
    const soma = k => rs.reduce((a, r) => a + r[k], 0);
    anos.push({ano: i/12 + 1, de: rs[0].m, ate: fim.m, meses: rs.length, abertos: abertos.length,
      alunosMedia: abertos.length ? abertos.reduce((a, r) => a + r.alunos, 0)/abertos.length : 0, alunosFim: fim.alunos === null ? 0 : fim.alunos,
      studio: soma("recStudio"), salas: soma("recSalas"), total: soma("receita")});
  }
  const t = anos.reduce((a, y) => ({studio: a.studio + y.studio, salas: a.salas + y.salas, total: a.total + y.total, abertos: a.abertos + y.abertos}), {studio:0, salas:0, total:0, abertos:0});
  return {anos, total: {...t, meses: s.rows.length, alunosFim: anos.length ? anos[anos.length-1].alunosFim : 0}};
}
// D9: quadro alunos × ticket médio × faturamento das mensalidades por mês (studio).
// Linhas: 50% a 100% das vagas, ponto de equilíbrio e meta. Colunas: ticket médio atual e com os preços 10% e 5% menores e 5%, 10% e 20% maiores.
const QF_TICKETS = [0.9, 0.95, 1, 1.05, 1.1, 1.2];
function quadroFaturamento(s){
  const d = s.d, lot = d.lotacao, A = Math.round(s.A), be = Number.isFinite(s.be) ? s.be : null;
  const ns = [...new Set([0.5,0.6,0.7,0.8,0.9,1].map(x => Math.round(lot*x)).concat([be, A].filter(x => x !== null)))].filter(n => n > 0).sort((a,b) => a-b);
  const tickets = QF_TICKETS.map(f => ({f, t: d.ticket*f}));
  return {tickets, lot, A, be, linhas: ns.map(n => ({n, empata: n===be, meta: n===A, maximo: n===lot, vals: tickets.map(x => n*x.t)}))};
}
// TIR mensal por bisseção, anualizada. null se não houver troca de sinal (ex.: fluxo nunca volta, ou duas trocas).
function irr(flows){
  const npv = rate => flows.reduce((s,f,i)=> s + f/Math.pow(1+rate,i), 0);
  let lo = -0.9, hi = 1, flo = npv(lo), fhi = npv(hi);
  while(!(flo*fhi < 0) && hi < 64){ hi *= 2; fhi = npv(hi); } // retornos acima de 100% ao mês
  if(!(flo*fhi < 0)) return null;
  for(let i=0;i<200;i++){ const mid=(lo+hi)/2, fm=npv(mid); if(flo*fm<=0){hi=mid;fhi=fm;} else {lo=mid;flo=fm;} }
  return Math.pow(1+(lo+hi)/2, 12) - 1;
}
function scenario(p, sign){
  const q = {...p}, a = p.varAlunos/100*sign, o = p.varOcup/100*sign, pr = p.varPrecos/100*sign, c = -p.varCustos/100*sign, r = -p.varRampa/100*sign;
  q.alunosAlvo = Math.max(0, Math.round(p.alunosAlvo*(1+a)));
  if(p.modoCrescimento!=="captacao") q.alunosIniciais = Math.min(q.alunosAlvo, p.alunosIniciais); // na captação a meta não vale
  q.novosMes = Math.max(0, p.novosMes*(1+a));
  q.ocupCow = Math.min(100, Math.max(0, p.ocupCow*(1+o)));
  ["p2","p3","p45","precoHora","precoAvulsa","precoTurno","aluguelFixoSala","matricula"].forEach(k => q[k] = Math.max(0, p[k]*(1+pr)));
  ["custoHoraInstr","apoio","utilidades","marketing","software","contador","seguro","residuos","outros","condIptu","taxasPrediais"].forEach(k => q[k] = Math.max(0, p[k]*(1+c)));
  q.rampa = p.rampa>0 ? Math.max(1, Math.round(p.rampa*(1+r))) : 0;
  q.rampaCow = p.rampaCow>0 ? Math.max(1, Math.round(p.rampaCow*(1+r))) : 0;
  return q;
}
function sensitivity(p){
  const base = regime(p, p.modelo), lot = q => deriv(q).lotacao;
  const items = [
    ["Preço dos planos", (q,f)=>{q.p2*=f;q.p3*=f;q.p45*=f;}],
    ["Número de alunos", (q,f)=>{ if(q.modoCrescimento==="captacao") q.novosMes*=f; else q.alunosAlvo=Math.round(q.alunosAlvo*f); }],
    ["Alunos ao mesmo tempo", (q,f)=>{q.capSim=Math.round(q.capSim*f);}],
    ["Taxa de faltas", (q,f)=>{q.faltas*=f;}],
    ["Ocupação das salas", (q,f)=>{q.ocupCow*=f;}],
    ["Preço da hora das salas", (q,f)=>{q.precoHora*=f;q.precoAvulsa*=f;q.precoTurno*=f;}],
    ["Aluguel", (q,f)=>{q.aluguel*=f;}],
    ["Condomínio + IPTU", (q,f)=>{q.condIptu*=f;}],
    ["Custo da hora do instrutor", (q,f)=>{q.custoHoraInstr*=f;}],
    ["Recepção e limpeza", (q,f)=>{q.apoio*=f;}],
    ["Energia, água e internet", (q,f)=>{q.utilidades*=f;}],
    ["Divulgação mensal", (q,f)=>{q.marketing*=f;}],
    ...(p.modoSimples==="manual" ? [["Imposto (Simples)", (q,f)=>{q.tSimples*=f;}]] : []),
  ];
  return {base, lotBase: lot(p), rows: items.map(([l,fn]) => {
    const out = [0.9,1.1].map(f => { const q = {...p}; fn(q,f); const r = regime(q, q.modelo); return {res:r.resultado, be:r.be, lot:lot(q)}; });
    return {l, lo:out[0], hi:out[1], swing:Math.abs(out[1].res-out[0].res)};
  }).sort((a,b)=>b.swing-a.swing)};
}

function renderInputs(){
  const el = document.getElementById("inputs");

  let h = `<div class="side-head"><h2>Cenários rápidos</h2><p>Um clique muda várias premissas de uma vez. Dá para desfazer logo em seguida.</p>

    <div class="side-head"><h2>Meus cenários</h2><p>Grave as premissas atuais com um nome para voltar a elas depois. Ficam guardados neste navegador; para levar a outro computador, use "Baixar cenário".</p>
    <div class="cen-form"><input class="search" id="cenNome" placeholder="Nome do cenário (ex.: contrato com condomínio)" maxlength="80"><button class="btn" id="cenGravar">Gravar</button></div>
    <div id="cenLista"></div>${UI.cenario ? `<div class="cen-atual">Cenário em uso: <b>${escHtml(UI.cenario)}</b></div>` : ""}</div>
    <div class="side-head"><h2>Premissas</h2><p>Altere qualquer valor e veja o resultado na hora. Campos alterados ficam em amarelo.</p>
    <div class="seg"><button data-modo="essencial">Só o essencial</button><button data-modo="todas">Todas as premissas</button></div>
    <input class="search" id="search" type="search" placeholder="Procurar (ex.: aluguel, sala, imposto)">
    <div class="changed-note" id="changedCount"></div></div>`;
  GROUPS.forEach(g => {
    h += `<details class="grp" data-g="${g.id}" ${["imovel","planos","metas"].includes(g.id)?"open":""}><summary><span><span class="t">${g.g}</span><span class="s" id="gi_${g.id}"></span></span></summary><p class="gintro">${g.intro}</p>`;
    g.f.forEach(([id,l,u,,st,hint,ess]) => {
      const ch = P[id]!==DEFAULTS[id] ? " changed" : "";
      const ctl = SELECTS[id]
        ? `<select id="f_${id}">${Object.entries(SELECTS[id]).map(([k,v])=>`<option value="${k}" ${P[id]===k?"selected":""}>${v}</option>`).join("")}</select>`
        : `<input id="f_${id}" type="number" inputmode="decimal" min="${limites(id)[0]}" max="${limites(id)[1]}" step="${st}" value="${P[id]}">`;
      h += `<div class="field${ch}" data-id="${id}" data-ess="${ess?1:0}" data-label="${(g.g+" "+l+" "+hint).toLowerCase()}">
        <div class="row"><label for="f_${id}">${l}</label><div class="inp">${ctl}<span class="u">${u}</span></div></div>
        ${hint?`<div class="help">${hint}</div>`:""}
        <button class="reset" data-id="${id}">Voltar ao valor padrão (${SELECTS[id]?SELECTS[id][DEFAULTS[id]]:num(DEFAULTS[id], DEFAULTS[id]%1?2:0)})</button></div>`;
    });
    h += `</details>`;
  });
  el.innerHTML = h;
  el.querySelectorAll(".field input").forEach(inp => inp.addEventListener("input", e => {
    const id = e.target.id.slice(2), v = parseFloat(e.target.value);
    if(Number.isFinite(v)){ P[id] = limitar(id, v); e.target.closest(".field").classList.toggle("changed", P[id]!==DEFAULTS[id]); save(); agendarResultados(); if(FIELDS[id].g==="equip") applyFilter(); }
  }));
  // Ao sair do campo: mostra o valor realmente usado (fora dos limites ou vazio, volta ao último válido)
  el.querySelectorAll(".field input").forEach(inp => inp.addEventListener("change", e => {
    const id = e.target.id.slice(2);
    if(String(P[id]) !== e.target.value) e.target.value = P[id];
  }));
  el.querySelectorAll(".field select").forEach(sel => sel.addEventListener("change", e => {
    const id = e.target.id.slice(2);
    P[id] = e.target.value; e.target.closest(".field").classList.toggle("changed", P[id]!==DEFAULTS[id]); save(); renderResults(); applyFilter();
  }));
  el.querySelectorAll(".reset").forEach(b => b.addEventListener("click", () => { P[b.dataset.id] = DEFAULTS[b.dataset.id]; save(); renderInputs(); renderResults(); }));
  el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { UI.modo = b.dataset.modo; saveUI(); applyFilter(); }));
  document.getElementById("search").addEventListener("input", applyFilter);
  el.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.preset; aplicarMudancas(presetValores(id, P), PRESETS[id].nome);
  }));
  document.getElementById("cenGravar").addEventListener("click", () => {
    const inp = document.getElementById("cenNome"), nome = inp.value.trim();
    if(!nome){ inp.focus(); toast("Dê um nome ao cenário antes de gravar."); return; }
    const l = lerCenarios().filter(c => c.nome !== nome);
    l.unshift(cenarioArquivo(nome, P));
    if(!gravarCenarios(l)){ toast("Não foi possível gravar neste navegador. Use \"Baixar cenário\"."); return; }
    UI.cenario = nome; saveUI(); renderInputs(); toast(`Cenário "${nome}" gravado.`);
  });
  renderCenarios();
  applyFilter();
}
// Campos de "Aparelhos" que fazem sentido para cada forma de aquisição
function equipFields(p){
  switch(p.modelo){
    case "novos": return ["novosValor","novosManut"];
    case "leasing": return ["leasingAluguel","leasingPrazo"].concat(p.leasingPrazo>0 ? ["leasingVRG","novosValor","novosManut"] : []);
    case "cdc": return ["novosValor","cdcEntrada","cdcTaxa","cdcPrazo","novosManut"];
    default: return ["seminovosValor","seminovosManut"];
  }
}
function applyFilter(){
  const el = document.getElementById("inputs"), q = (document.getElementById("search").value||"").trim().toLowerCase();
  el.querySelectorAll(".seg button").forEach(b => { b.classList.toggle("on", b.dataset.modo===UI.modo); b.setAttribute("aria-pressed", b.dataset.modo===UI.modo ? "true" : "false"); });
  el.querySelectorAll("details.grp").forEach(d => {
    let any = false;
    const eqList = equipFields(P);
    d.querySelectorAll(".field").forEach(f => {
      const id = f.dataset.id, isEq = FIELDS[id].g==="equip" && id!=="modelo";
      // Aparelhos: só os campos da forma escolhida, sempre visíveis (são poucos)
      // Simples automático: os percentuais manuais ficam escondidos
      const manualOnly = (id==="tSimples" || id==="tCow") && P.modoSimples!=="manual";
      const capt = P.modoCrescimento==="captacao";
      const growthHide = (id==="novosMes" && !capt) || ((id==="alunosAlvo" || id==="rampa") && capt);
      const vis = !manualOnly && !growthHide && (isEq
        ? eqList.includes(id) && (!q || f.dataset.label.includes(q))
        : (q ? f.dataset.label.includes(q) : true) && (q || UI.modo==="todas" || f.dataset.ess==="1" || f.classList.contains("changed")));
      f.classList.toggle("hidden", !vis); any = any || vis;
    });
    d.style.display = any ? "" : "none"; if(q && any) d.open = true;
  });
}

// ================= Interface: resultados =================
function verdict(p, s){
  const d = s.d, beOk = Number.isFinite(s.be) && s.be <= d.lotacao;
  if(!beOk || s.resultado<=0) return ["bad","✕","Com estas premissas, o negócio não se sustenta.",
    !Number.isFinite(s.be) ? "Nenhum número de alunos cobre os custos."
    : s.be > d.lotacao ? `Precisaria de ${s.be} alunos para empatar, mas só cabem ${d.lotacao}.${s.resultado>0?` O lucro de ${brl(s.resultado)}/mês da simulação conta alunos que não cabem no studio.`:""}`
    : s.A < s.be ? `Com ${num(s.A)} alunos o resultado é de ${brl(s.resultado)}/mês. Para empatar são precisos ${s.be} alunos.`
    : `Com ${num(s.A)} alunos o resultado é de ${brl(s.resultado)}/mês, embora ${s.be} alunos já empatem: com mais faturamento o Simples fica mais caro (faixa ou Anexo V pelo Fator R).`];
  if(s.payback===null) return ["bad","✕","Dá lucro quando estiver cheio, mas o investimento não volta.", `Com lucro de ${brl(s.resultado)}/mês e ${num(s.A)} alunos, os ${brl(s.exposicao)} que precisam ser colocados não voltam em ${anosTxt(s.H)}.`];
  if(s.vpl<0) return ["warn","!","O investimento volta, mas rende menos do que outra aplicação.", `Recupera em ${tempo(s.payback)}, porém rende abaixo dos ${num(p.tma,1)}% ao ano desejados.`];
  if(s.be/d.lotacao>0.7 || (capDisp(p)>0 && capDisp(p)<s.exposicao)) return ["warn","!","Viável, mas com risco alto.", `Precisa de ${pct(s.be/d.lotacao,0)} das vagas ocupadas para empatar${capDisp(p)>0 && capDisp(p)<s.exposicao?` e faltam ${brl(s.exposicao-capDisp(p))} de capital`:""}.`];
  return ["ok","✓","Viável com estas premissas.", `Recupera o investimento em ${tempo(s.payback)} e rende ${s.tir===null?`acima dos ${num(p.tma,1)}%`:pct(s.tir,0)} ao ano.`];
}
function alerts(p, s){
  const a = [], d = s.d;
  if(Math.abs(d.mixSum-100)>0.01) a.push(["bad",`Os três planos somam ${num(d.mixSum,1)}% dos alunos. Ajuste para somar 100%.`]);
  if(p.pctAvulsa+p.pctTurno>100) a.push(["bad","Horas avulsas + turno fixo passam de 100% das horas alugadas."]);
  if(p.salasFixas>p.salas) a.push(["bad","Há mais salas em contrato mensal do que salas existentes."]);
  if(d.areaNec > p.areaUtilTerreo + 0.01) a.push(["warn",`${d.capSim} alunos × ${num(p.m2Aluno,1)} m² = ${num(d.areaNec)} m² de área livre para treinar, mas a estimativa do térreo é de ${num(p.areaUtilTerreo)} m². Nessa área cabem ${d.capArea} alunos ao mesmo tempo (≈ ${d.lotArea} alunos ativos, contra ${d.lotacao} com ${d.capSim}). Confirmar com a planta.`]);
  const areaTreino = Math.max(p.areaUtilTerreo, d.areaNec);
  if(areaTreino > p.areaBrutaTerreo) a.push(["bad",`A área de treino (${num(areaTreino)} m²) é maior que o térreo inteiro (${p.areaBrutaTerreo} m²).`]);
  else if(areaTreino > p.areaBrutaTerreo*0.8) a.push(["warn",`A área de treino (${num(areaTreino)} m²) ocupa ${pct(areaTreino/p.areaBrutaTerreo,0)} do térreo. Sobra pouco para recepção, escada e banheiros.`]);
  const area = p.salaLarg*p.salaComp, menor = Math.min(p.salaLarg,p.salaComp);
  if(p.salas>0 && (area < 7.5 || menor < 2.2)) a.push(["warn",`Cada sala tem ${num(area,2)} m². A norma da Anvisa (RDC 50) pede 7,5 m² e lado mínimo de 2,2 m para consultório. O projeto prevê salas só de terapia; depende de aceite da Vigilância Sanitária.`]);
  if(p.salas*area > p.areaBruta2*0.7) a.push(["warn",`As salas ocupam ${pct(p.salas*area/p.areaBruta2,0)} do 2º andar. Sobra pouco para escada, corredor e espera.`]);
  const alvoBruto = alunosRegime(p, d, false);
  if(alvoBruto > d.lotacao) a.push([p.limitarVagas==="sim"?"warn":"bad", p.modoCrescimento==="captacao"
    ? `Com ${num(p.novosMes)} alunos novos por mês e ${num(p.churn,1)}% de cancelamento, a base chegaria a ${num(alvoBruto)} alunos, mais do que cabe no studio (${d.lotacao}).${p.limitarVagas==="sim"?" A simulação para nas vagas.":""}`
    : `A meta de ${num(p.alunosAlvo)} alunos é maior do que cabe no studio (${d.lotacao}).${p.limitarVagas==="sim"?" A simulação limita às vagas.":" Reduza a meta ou aumente horário/área."}`]);
  if(p.modoCrescimento==="captacao" && p.churn>0 && s.rows.length && s.rows[s.rows.length-1].alunos < s.A*0.95) a.push(["warn",`Por captação, a base de ${num(s.A)} alunos (usada no lucro do topo) só é alcançada aos poucos: no fim dos ${num(s.H)} meses são ${num(s.rows[s.rows.length-1].alunos)}. O caixa, o prazo para recuperar e o VPL já usam os alunos de cada mês.`]);
  if(p.modoCrescimento==="captacao" && p.churn<=0) a.push(["warn","No modo por captação, informe a taxa de cancelamentos (grupo Planos). Sem ela, a base de alunos só cresce."]);
  if(p.modoCrescimento==="captacao" && Number.isFinite(s.be) && s.A < s.be) a.push(["bad", p.churn>0
    ? `Com ${num(p.novosMes)} alunos novos por mês e ${num(p.churn,1)}% de cancelamento, a base se estabiliza em ${num(s.A)} alunos, abaixo dos ${s.be} necessários para empatar. Seriam precisos ~${num(Math.ceil(s.be*p.churn/100))} novos por mês.`
    : `Com ${num(p.novosMes)} alunos novos por mês e sem cancelamentos, a base chega a ${num(s.A)} alunos no fim do período, abaixo dos ${s.be} necessários para empatar.`]);
  if(p.modoSimples!=="manual"){
    if(d.anexo==="V") a.push(["bad",`Fator R de ${pct(d.fatorR,0)}: a folha (${brl(d.folhaR)}/mês) fica abaixo de 28% do faturamento, e o Simples passa para o Anexo V (${pct(d.tSimp)} em vez de ~${pct(simplesEfetivo(12*s.receitaTotal,"III"))}). Instrutores como CLT/autônomo ou pró-labore aumentam a folha.`]);
    else if(d.fatorR < 0.32) a.push(["warn",`Fator R de ${pct(d.fatorR,0)}, perto do limite de 28%. Se o faturamento crescer sem aumentar a folha, o Simples passa para o Anexo V (bem mais caro).`]);
    if(s.mesesAnexoV>0 && d.anexo!=="V") a.push(["warn",`Em ${s.mesesAnexoV} mês(es) da simulação o Fator R ficou abaixo de 28% e o Simples foi pelo Anexo V.`]);
  }
  if(p.faltas<0 || p.faltas>=100) a.push(["bad","A taxa de faltas precisa ficar entre 0% e 99%."]);
  if(capDisp(p)>0 && capDisp(p) >= s.exposicao && capDisp(p) < s.capitalRec) a.push(["warn",`${capNome(p)} (${brl(capDisp(p))}) cobre o necessário, mas não a reserva de ${num(p.reservaMeses)} meses. Capital recomendado: ${brl(s.capitalRec)}.`]);
  if(Number.isFinite(s.be) && s.be <= d.lotacao && s.be/d.lotacao > 0.7) a.push(["warn",`Para empatar é preciso ocupar ${pct(s.be/d.lotacao,0)} das vagas. Pouca folga se os alunos demorarem a vir.`]);
  if(capDisp(p)>0 && capDisp(p) < s.exposicao) a.push(["bad",`${capNome(p)} (${brl(capDisp(p))}) não cobre o dinheiro necessário (${brl(s.exposicao)}). Faltam ${brl(s.exposicao-capDisp(p))}.`]);
  if(capDisp(p)===0) a.push(["warn","O capital disponível dos sócios ainda não foi informado (grupo \"Dinheiro dos sócios\")."]);
  if(Math.max(0,p.fechaSemana-p.abreSemana)===0 && Math.max(0,p.fechaSab-p.abreSab)===0) a.push(["bad","O studio está sem horário de funcionamento."]);
  if([p.abreSemana,p.fechaSemana,p.abreSab,p.fechaSab,p.abreDom,p.fechaDom].some(v => v<0 || v>24)) a.push(["bad","Há horário de abertura ou fechamento fora do intervalo de 0 a 24 h."]);
  if(p.horasPico2 > d.horasOp) a.push(["warn",`As horas com instrutor extra (${num(p.horasPico2)}) passam das horas abertas no mês (${num(d.horasOp)}).`]);
  if(d.horasSala > d.horasOp + 0.01) a.push(["warn",`As salas ficam disponíveis ${num(d.horasSala)} h/mês, mais que as ${num(d.horasOp)} h em que o studio fica aberto. Recepção e limpeza estão dimensionadas para o horário do studio.`]);
  if([p.abreSalaSemana,p.fechaSalaSemana,p.abreSalaSab,p.fechaSalaSab,p.abreSalaDom,p.fechaSalaDom].some(v => v<0 || v>24)) a.push(["bad","Há horário das salas fora do intervalo de 0 a 24 h."]);
  if(p.prazoContrato>0 && p.horizonte > p.prazoContrato) a.push(["warn",`A análise vai até o mês ${num(p.horizonte)}, mas o contrato de locação termina no mês ${num(p.prazoContrato)}. Depois disso, o aluguel e a permanência dependem da renovação.`]);
  if(p.fatorOcup>100 || p.ocupCow>100) a.push(["bad","Aproveitamento dos horários ou ocupação das salas acima de 100%."]);
  if(p.modoCrescimento!=="captacao" && p.alunosIniciais > p.alunosAlvo) a.push(["warn","Há mais alunos na inauguração do que na meta. A simulação usa a meta."]);
  if(s.A>0 && Number.isFinite(s.be) && s.A >= s.be && s.resultado < 0) a.push(["bad",`Com ${s.be} alunos o negócio já empata, mas com ${num(s.A)} alunos o resultado volta a ser negativo (${brl(s.resultado)}/mês): o faturamento maior encarece o Simples${p.modoSimples!=="manual"&&d.anexo==="V"?" (Anexo V pelo Fator R)":""}. Veja a tabela "Lucro por número de alunos".`]);
  if(p.horizonte < 12) a.push(["warn",`O período analisado mínimo é de 12 meses; a simulação usa 12 em vez de ${num(p.horizonte)}.`]);
  if(s.A>0 && Number.isFinite(s.be) && s.A >= s.be && s.be <= d.lotacao && s.resultado >= 0) a.push(["ok",`${p.modoCrescimento==="captacao"?"A base estável":"A meta"} de ${num(s.A)} alunos fica ${num(s.A-s.be)} acima do ponto de equilíbrio.`]);
  return a;

// ================= Meta inversa (D5) =================
// Menor valor em [lo, hi] que cumpre ok(); null se nenhum cumpre. O resultado nem sempre melhora quando o valor cresce
// (o Simples pode mudar de anexo pelo Fator R), então primeiro varre em passos e depois refina entre o último que falha e o 1º que cumpre.
function buscaMin(lo, hi, ok, inteiro, passos = 60){
  if(ok(lo)) return lo;
  let a = lo, b = null;
  for(let i=1; i<=passos; i++){ const x = inteiro ? Math.round(lo + (hi-lo)*i/passos) : lo + (hi-lo)*i/passos;
    if(x <= a) continue; if(ok(x)){ b = x; break; } a = x; }
  if(b === null) return null;
  for(let i=0; i<(inteiro ? 40 : 32); i++){
    if(inteiro && b - a <= 1) break;
    const mid = inteiro ? Math.floor((a+b)/2) : (a+b)/2;
    if(ok(mid)) b = mid; else a = mid;
  }
  return b;
}
const comPrecos = (p, f) => ({...p, p2:p.p2*f, p3:p.p3*f, p45:p.p45*f});
// Alunos para chegar a um lucro mensal (conta exata, como o ponto de equilíbrio)
function alunosParaLucro(p, alvo){ const q = intMonths(p), d = deriv(q); const n = minAlunos(q, q.modelo, alvo, d, equip(q, q.modelo)); return Number.isFinite(n) ? n : null; }
function metaInversa(p){
  const lucroOk = q => regime(intMonths(q), q.modelo).resultado >= p.lucroAlvo;
  const pbOk = q => { const x = simulate(q, q.modelo); return x.payback !== null && x.payback <= p.paybackAlvo; };
  const alvo = (ok, lucro) => ({
    alunos: lucro ? alunosParaLucro(p, p.lucroAlvo) : buscaMin(0, 3000, n => ok(comAlunos(p, n, {limitarVagas:"nao"})), true),
    preco:  buscaMin(0.3, 3, f => ok(comPrecos(p, f)), false),
    ocup:   buscaMin(0, 100, o => ok({...p, ocupCow:o}), false),
  });
  return {lucro: alvo(lucroOk, true), payback: alvo(pbOk, false)};
}

function folego(s, capital){
  if(!(capital > 0)) return null;
  const v0 = -s.upfront + s.p.empValor;
  let acaba = v0 < -capital ? 0 : null;
  if(acaba === null){ const r = s.rows.find(r => r.cumSoc < -capital); if(r) acaba = r.m; }

// ================= Sócios: fontes e usos, retorno, venda e fechamento (F4–F6, F8–F10) =================
// Dinheiro disponível para o negócio: o dos sócios (o empréstimo já entra no caixa dos sócios). Só os sócios fazem parte do negócio.
const capDisp = p => p.capital;
const capNome = () => "O capital dos sócios";
// Saldo devedor de um financiamento de parcelas fixas depois de "pagas" parcelas
function saldoDevedor(pv, i, n, pagas){
  if(!(pv>0) || pagas>=n) return 0;
  if(!i) return pv*(1 - pagas/n);
  return pmt(pv, i, n)*(1 - Math.pow(1+i, -(n-pagas)))/i;
}
// Dívidas em aberto no fim do mês m (contado da assinatura): empréstimo e CDC dos aparelhos
function dividasNoMes(p, m, modelo = p.modelo){
  const emp = p.empValor>0 ? (m<=p.empCarencia ? p.empValor : p.empPrazo<=0 ? 0 : saldoDevedor(p.empValor, p.empTaxa/100, p.empPrazo, m - p.empCarencia)) : 0;
  return emp + saldoCDC(p, m, modelo);
}
// Saldo do financiamento (CDC) dos aparelhos no fim do mês m (as parcelas começam no 1º mês aberto)
function saldoCDC(p, m, modelo = p.modelo){
  if(modelo!=="cdc" || !(p.cdcPrazo>0)) return 0;
  const k = Math.max(0, m - p.mesesObra);
  return saldoDevedor(p.novosValor - Math.min(p.cdcEntrada, p.novosValor), p.cdcTaxa/100, p.cdcPrazo, Math.min(k, p.cdcPrazo));
}
// Aplicação financeira (CDI/Tesouro): IR regressivo pelo prazo
// 22,5% até 180 dias, 20% até 360, 17,5% até 720, 15% acima. Em meses: 6 meses já passam de 180 dias (≈ 182).
const irAplicacao = meses => meses<=5 ? 0.225 : meses<=11 ? 0.20 : meses<=23 ? 0.175 : 0.15;
function metricasFluxo(f){
  const aportado = Math.max(0, -f.filter(v => v<0).reduce((a,b)=>a+b,0)), recebido = f.filter(v => v>0).reduce((a,b)=>a+b,0);
  let cum = 0, payback = null;
  f.forEach((v,i) => { cum += v; if(payback===null && i>0 && cum >= -1e-6 && aportado>0) payback = i; });
  return {aportado, recebido, moic: aportado>0 ? recebido/aportado : null, tir: aportado>0 ? irr(f) : null, payback};
}
// Fluxos de caixa dos sócios (o dinheiro deles, já com o empréstimo): mês 0 = −investimento para abrir + empréstimo;
// depois, o resultado de cada mês (com as parcelas do empréstimo); no mês T, + venda + caução − dívidas em aberto.
function fluxoSocios(s, T, venda){
  const f = [-s.upfront + s.p.empValor, ...s.rows.slice(0, T).map(r => r.soc)];
  f[T] += venda + s.caucaoVal - dividasNoMes(s.p, T);
  return f;
}
function socios(p, s){
  const q = s.p, H = s.H;
  // F6: fontes e usos até o pior momento do caixa, mais a reserva. Sem capital informado, o exemplo é o capital recomendado.
  const exemploCap = !(p.capital>0), capital = exemploCap ? s.capitalRec : p.capital;
  let obraP = 0, opP = 0, parc = 0;
  s.rows.forEach(r => { if(r.m<=s.minMes){ if(r.fase==="Obra") obraP += r.proj; else opP += r.proj; parc += loanPay(q, r.m); } });
  const usos = [["Obra e instalações", s.d.capexObra], [`Aparelhos (${MODELS[p.modelo]})`, s.eq.capex], ["Luvas e caução", q.luvas + s.caucaoVal],
    ["Aluguel e custos durante a obra", -obraP], [`Prejuízo da operação até o mês ${s.minMes}`, -opP], [`Parcelas do empréstimo até o mês ${s.minMes}`, parc],
    ["Reserva de segurança", s.reserva]];
  const fontes = [[exemploCap ? "Sócios (exemplo: o capital recomendado)" : "Sócios", capital], ["Empréstimo", q.empValor]];
  const totU = usos.reduce((a,[,v])=>a+v,0), totF = fontes.reduce((a,[,v])=>a+v,0);
  // Retorno dos sócios no período, com a venda do negócio no fim se informada
  const fluxo = fluxoSocios(s, H, s.residual), met = metricasFluxo(fluxo);
  // F3: aplicação com o mesmo dinheiro, nas mesmas datas, com IR regressivo pelo prazo da análise
  const irA = irAplicacao(H), fb = Math.pow(1 + p.tma/100, H/12);
  const taxaAplicLiq = Math.pow(1 + (fb - 1)*(1 - irA), 12/H) - 1, iml = Math.pow(1 + taxaAplicLiq, 1/12) - 1;
  const aplicFinal = fluxo.reduce((a,v,i) => v<0 ? a - v*Math.pow(1+iml, H-i) : a, 0);
  const negFinal = fluxo.reduce((a,v,i) => v>0 ? a + v*Math.pow(1+iml, H-i) : a, 0);
  const vplAplic = fluxo.reduce((a,v,i) => a + v/Math.pow(1+iml, i), 0);
  // F4: resultado dos sócios se o negócio fechar no mês m
  const valAp = p.modelo==="seminovos" ? p.seminovosValor : (p.modelo==="leasing" ? 0 : p.novosValor);
  const mesesF = [...new Set([6,12,18,24,36,48,60,72,84,96,120].filter(m => m<H).concat([H]))];
  const encerrar = mesesF.map(m => { const r = s.rows[m-1], k = Math.max(0, m - q.mesesObra);
    const valApM = p.modelo==="leasing" && q.leasingPrazo>0 && k>q.leasingPrazo ? p.novosValor : valAp;
    const revenda = valApM*p.revendaAparelhos/100*Math.max(0, 1 - k/(Math.max(1, p.vidaAparelhos)*12));
    const alugM = q.aluguel*Math.pow(1 + p.reajAluguel/100, Math.floor((m-1)/12));
    const multa = m < q.prazoContrato ? alugM*p.multaAluguel*(q.prazoContrato - m)/q.prazoContrato : 0;
    const dividas = dividasNoMes(q, m);
    return {m, k, caixa: r.cumSoc, revenda, caucao: s.caucaoVal, multa, dividas, res: r.cumSoc + revenda + s.caucaoVal - multa - dividas}; });
  // F5: venda do negócio ao fim de cada ano, a partir do 2º (exemplo: 2 vezes o lucro anual)
  const multEx = p.multSaida>0 ? p.multSaida : 2, exemploMult = !(p.multSaida>0);
  const saidas = [];
  for(let y=2; y*12<=H; y++){ const T = y*12, lucro12 = s.rows.filter(r => r.m>T-12 && r.m<=T).reduce((a,r) => a + r.proj, 0);
    const venda = Math.max(0, lucro12)*multEx, f = fluxoSocios(s, T, venda), mt = metricasFluxo(f), dividas = dividasNoMes(q, T);
    saidas.push({ano: y, T, lucro12, venda, caixa: s.rows[T-1].cumSoc, dividas, total: s.rows[T-1].cumSoc + venda + s.caucaoVal - dividas, tir: mt.tir, moic: mt.moic}); }
  return {capital, exemploCap, fluxo, met, irA, taxaAplicLiq, aplicFinal, negFinal, vplAplic, usos, fontes, totU, totF, encerrar, saidas, multEx, exemploMult, valAp};
}

}

const PROB_N = {Baixa:1, "Média":2, Alta:3}, IMP_N = {Baixo:1, "Médio":2, Alto:3};

  ["custoHoraInstr","apoio","utilidades","marketing","software","contador","seguro","residuos","outros","condIptu","taxasPrediais"].forEach(k => custos[k] = p[k]*1.1);
  const lista = [
    {nome:"Condomínio + IPTU não é zero (R$ 3.200/mês)", prob: p.condIptu>=3200 ? "Baixa" : "Média", mud:{condIptu: Math.max(p.condIptu, 3200)}, mitig:"Confirmar por escrito com o proprietário antes de assinar; negociar teto no contrato."},
    {nome: p.modoCrescimento==="captacao" ? "Metade dos alunos novos por mês" : "Alunos chegam no dobro do tempo", prob:"Média", mud: p.modoCrescimento==="captacao" ? {novosMes: p.novosMes/2} : {rampa: Math.max(1,p.rampa)*2, rampaCow: Math.max(1,p.rampaCow)*2}, mitig:"Pré-venda antes da inauguração; meta mínima de alunos para abrir."},
    {nome:"Salas alugam um terço a menos", prob:"Média", mud:{ocupCow: p.ocupCow*2/3}, mitig:"Cartas de intenção de terapeutas antes da obra; 1 ou 2 salas em contrato mensal fixo."},
    {nome:"Preços dos planos 10% abaixo", prob:"Média", mud: precos(0.9), mitig:"Validar preços com pesquisa ou pré-venda (preços ainda não validados, RN-002)."},
    {nome:"Obra custa 20% a mais", prob:"Alta", mud: Object.fromEntries(["capexNaoDet","capObraCivil","capEletrica","capHidraulica","capClima","capPiso","capAcess","capProjeto","capLicencas","capMobiliario","capTI","capMktPre"].map(k => [k, p[k]*1.2])), mitig:"Três orçamentos fechados; contrato de empreitada com preço global."},
    {nome:"Área de treino menor que a estimada", prob: d.capArea < d.capSim ? "Alta" : "Baixa", mud: d.capArea < d.capSim ? {capSim: d.capArea} : {}, semEfeito: !(d.capArea < d.capSim), mitig:"Conferir com a planta; ajustar leiaute ou capacidade (RN-013)."},
    {nome:"Custos mensais 10% maiores", prob:"Média", mud: custos, mitig:"Orçamentos de contas e serviços; revisar contratos a cada ano."},
    {nome:"Inadimplência de 5% dos alunos", prob:"Média", mud:{inadimpl: Math.max(p.inadimpl, 5)}, mitig:"Cobrança recorrente no cartão; acesso bloqueado na fechadura em caso de atraso."},
    {nome:"Simples no Anexo V (instrutores MEI/PJ)", prob: p.vinculoInstr==="pj" ? "Alta" : "Baixa", mud:{vinculoInstr:"pj"}, semEfeito: p.vinculoInstr==="pj" || p.modoSimples==="manual", mitig:"Contratar instrutores CLT ou autônomos pessoa física; acompanhar o Fator R com o contador."},
    {nome:"Vigilância exige salas de 7,5 m²", prob:"Média", mud:{}, semEfeito:true, mitig:"Consulta prévia à SUBVISA-RJ antes da obra; se exigir, manter 4 salas e restringir a terapia (RN-005)."},
  ];
  return lista.map((r, i) => {
    const q = sanitize({...p, ...r.mud}), x = simulate(q, q.modelo);
    const queda = (s.resultado - x.resultado)/Math.max(1, Math.abs(s.resultado));
    const dpb = s.payback===null ? 0 : (x.payback===null ? Infinity : x.payback - s.payback);
    const imp = r.semEfeito ? "Baixo" : ((x.payback===null && s.payback!==null) || queda>0.3 || dpb>=12) ? "Alto" : (queda>0.1 || dpb>=4 ? "Médio" : "Baixo");
    return {...r, n: i+1, resultado: x.resultado, dLucro: x.resultado - s.resultado, payback: x.payback, exposicao: x.exposicao, imp, sev: PROB_N[r.prob]*IMP_N[imp]};
  });
}

// ================= Simulação de risco — Monte Carlo (D7) =================
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function monteCarlo(p, n = 500, seed = 20261115){
  const r = rng(seed), f = v => 1 + (v/100)*(2*r() - 1);
  const res = [];
  for(let i=0; i<n; i++){
    const fa = f(p.varAlunos), fo = f(p.varOcup), fp = f(p.varPrecos), fc = f(p.varCustos), fr = f(p.varRampa);
    const q = {...p, alunosAlvo: Math.round(p.alunosAlvo*fa), novosMes: p.novosMes*fa, ocupCow: Math.min(100, p.ocupCow*fo)};
    ["p2","p3","p45","precoHora","precoAvulsa","precoTurno","aluguelFixoSala","matricula"].forEach(k => q[k] = p[k]*fp);
    ["custoHoraInstr","apoio","utilidades","marketing","software","contador","seguro","residuos","outros","condIptu","taxasPrediais"].forEach(k => q[k] = p[k]*fc);
    q.rampa = p.rampa>0 ? Math.max(1, Math.round(p.rampa*fr)) : 0;
    q.rampaCow = p.rampaCow>0 ? Math.max(1, Math.round(p.rampaCow*fr)) : 0;
    if(p.modoCrescimento!=="captacao") q.alunosIniciais = Math.min(q.alunosAlvo, p.alunosIniciais); // na captação a meta não vale
    const x = simulate(q, q.modelo);
    res.push({payback: x.payback === null ? Infinity : x.payback, exposicao: x.exposicao, vpl: x.vpl, resultado: x.resultado});
  }
  const q = (arr, k) => { const a = arr.map(o => o[k]).sort((a,b) => a-b); return [0.1,0.5,0.9].map(t => a[Math.min(a.length-1, Math.floor(t*a.length))]); };
  const share = fn => res.filter(fn).length / n;
  const buckets = [["até 12 meses",0,12],["13 a 24",13,24],["25 a 36",25,36],["37 a 48",37,48],["49 a 60",49,60],["61 ou mais",61,1e9]];
  const hist = buckets.map(([l,a,b]) => [l, share(o => o.payback>=a && o.payback<=b && Number.isFinite(o.payback))]).concat([["não volta", share(o => !Number.isFinite(o.payback))]]);
  return {n, pPrazo: share(o => o.payback <= p.paybackAlvo), pVolta: share(o => Number.isFinite(o.payback)), pVpl: share(o => o.vpl > 0), pPrej: share(o => o.resultado < 0),
          payback: q(res, "payback"), exposicao: q(res, "exposicao"), resultado: q(res, "resultado"), hist};
}

// ================= Gráficos genéricos (C1–C9) =================
function niceScale(mn, mx, n=5){
  if(!(mx>mn)) mx = mn + 1;
  const raw = (mx-mn)/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nr = raw/mag;
  const step = (nr<=1?1:nr<=2?2:nr<=2.5?2.5:nr<=5?5:10)*mag;
  return {mn: Math.floor(mn/step)*step, mx: Math.ceil(mx/step)*step, step};
}
const kR = v => Math.abs(v)<0.5 ? "R$ 0" : "R$ " + num(v/1000, Math.abs(v)<10000?1:0) + " mil";
function legendHTML(items){ return `<div class="legend">${items.map(([n,c,dash])=>`<span><i style="background:${c};${dash?"height:3px;border-radius:0":""}"></i>${n}</span>`).join("")}</div>`; }
// Linhas: o = {xs, series:[{name,color,vals}], yfmt, xfmt, xticks, refs:[{y,label}], vrefs:[{x,label}], marks:[{x,y,label,color}], tip(i,x), aria, H}
function lineChart(o){
  const W = 800, H = o.H || 260, L = 72, R = 16, T = 18, B = 32;
  const vals = o.series.flatMap(se => se.vals).concat((o.refs||[]).map(r => r.y)).filter(Number.isFinite);
  const sc = niceScale(Math.min(0, ...vals), Math.max(0, ...vals));
  const x0 = o.xs[0], x1 = o.xs[o.xs.length-1];
  const X = x => L + (x-x0)*(W-L-R)/Math.max(1e-9, x1-x0), Y = v => T + (sc.mx-v)*(H-T-B)/(sc.mx-sc.mn);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">`;
  for(let v = sc.mn; v <= sc.mx + sc.step/2; v += sc.step)
    svg += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${o.yfmt(v)}</text>`;
  svg += `<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1.2"/>`;
  (o.xticks || []).forEach((x, i, arr) => { const anc = i===0 ? "start" : (i===arr.length-1 ? "end" : "middle");
    svg += `<text x="${X(x)}" y="${H-10}" font-size="11" text-anchor="${anc}" fill="var(--muted)">${o.xfmt(x)}</text>`; });
  (o.refs || []).forEach(r => { svg += `<line x1="${L}" x2="${W-R}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${W-R-4}" y="${Y(r.y)-5}" font-size="11.5" text-anchor="end" fill="var(--text)">${r.label}</text>`; });
  (o.vrefs || []).forEach(r => { svg += `<line x1="${X(r.x)}" x2="${X(r.x)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${X(r.x)+5}" y="${T+12}" font-size="11.5" fill="var(--text)">${r.label}</text>`; });
  o.series.forEach(se => {
    const pts = se.vals.map((v,i) => `${X(o.xs[i]).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"${se.dash?' stroke-dasharray="6 4"':""}/>`;
  });
  // pontos invisíveis com dica (passe o mouse)
  if(o.tip) o.xs.forEach((x,i) => { svg += `<rect x="${X(x)-((W-L-R)/o.xs.length)/2}" y="${T}" width="${(W-L-R)/o.xs.length}" height="${H-T-B}" fill="transparent"><title>${o.tip(i,x)}</title></rect>`; });
  (o.marks || []).forEach(m => { const right = X(m.x) > W*0.65;
    svg += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="5" fill="${m.color}" stroke="var(--surface)" stroke-width="2"/><text x="${X(m.x)+(right?-8:8)}" y="${Y(m.y)+(m.dy||-9)}" font-size="12" text-anchor="${right?"end":"start"}" fill="var(--text)">${m.label}</text>`; });
  return svg + `</svg>`;
}
// Cascata (C4): steps = [{label, v, tipo:"ent"|"sai"|"res"}]
function waterfallChart(steps, aria){
  const W = 800, H = 300, L = 72, R = 16, T = 22, B = 46;
  let acc = 0; const bars = steps.map(st => { let y0, y1;
    if(st.tipo==="ent"){ y0 = 0; y1 = st.v; acc = st.v; }
    else if(st.tipo==="sai"){ y0 = acc; y1 = acc - st.v; acc = y1; }
    else { y0 = 0; y1 = st.v; }
    return {...st, y0, y1}; });
  const sc = niceScale(Math.min(0, ...bars.map(b => Math.min(b.y0,b.y1))), Math.max(0, ...bars.map(b => Math.max(b.y0,b.y1))));
  const Y = v => T + (sc.mx-v)*(H-T-B)/(sc.mx-sc.mn), gw = (W-L-R)/bars.length, bw = Math.min(64, gw*0.62);
  const col = {ent:"var(--s-in)", sai:"var(--s-out)", res:"var(--s-res)"};
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
  for(let v = sc.mn; v <= sc.mx + sc.step/2; v += sc.step)
    svg += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${kR(v)}</text>`;
  svg += `<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1.2"/>`;
  bars.forEach((b,i) => {
    const x = L + i*gw + (gw-bw)/2, top = Math.min(Y(b.y0), Y(b.y1)), h = Math.max(1, Math.abs(Y(b.y0)-Y(b.y1)));
    svg += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${col[b.tipo]}"><title>${b.label}: ${brl(b.tipo==="sai"?-b.v:b.v)}</title></rect>`;
    if(i < bars.length-1 && b.tipo!=="res") svg += `<line x1="${x+bw}" x2="${x+gw}" y1="${Y(b.y1)}" y2="${Y(b.y1)}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
    svg += `<text x="${x+bw/2}" y="${top-5}" font-size="11" text-anchor="middle" fill="var(--text)" font-weight="${b.tipo==="res"?700:500}">${b.tipo==="sai"?"−":""}${kR(Math.abs(b.v))}</text>`;
    const words = b.label.split(" "), half = Math.ceil(words.length/2);
    const l1 = words.length>2 ? words.slice(0,half).join(" ") : b.label, l2 = words.length>2 ? words.slice(half).join(" ") : "";
    svg += `<text x="${x+bw/2}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="var(--text)">${l1}</text>${l2?`<text x="${x+bw/2}" y="${H-B+30}" font-size="11" text-anchor="middle" fill="var(--text)">${l2}</text>`:""}`;
  });
  return svg + `</svg>`;
}
// Tornado (C5): rows = [{l, lo, hi}] (lucro com −10% e +10%), base = lucro atual
function tornadoChart(rows, base, aria){
  const W = 800, rowH = 26, T = 24, B = 26, L = 190, R = 70, H = T + B + rows.length*rowH;
  const vals = rows.flatMap(r => [r.lo, r.hi]).concat([base]);
  const sc = niceScale(Math.min(...vals), Math.max(...vals), 4);
  const X = v => L + (v - sc.mn)*(W-L-R)/(sc.mx-sc.mn);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
  for(let v = sc.mn; v <= sc.mx + sc.step/2; v += sc.step)
    svg += `<line x1="${X(v)}" x2="${X(v)}" y1="${T-6}" y2="${H-B}" stroke="var(--grid)"/><text x="${X(v)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--muted)">${kR(v)}</text>`;
  rows.forEach((r,i) => {
    const y = T + i*rowH + 4, h = rowH - 9;
    svg += `<text x="${L-8}" y="${y+h-3}" font-size="12" text-anchor="end" fill="var(--text)">${r.l}</text>`;
    [["lo","var(--s-out)","−10%"],["hi","var(--s-res)","+10%"]].forEach(([k,c,n]) => {
      const v = r[k], x0 = Math.min(X(base), X(v)), w = Math.max(1, Math.abs(X(v)-X(base)));
      svg += `<rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}"><title>${r.l} ${n}: lucro ${brl(v)} (${v>=base?"+":""}${brl(v-base)})</title></rect>`;
    });
  });
  svg += `<line x1="${X(base)}" x2="${X(base)}" y1="${T-6}" y2="${H-B}" stroke="var(--text)" stroke-width="1.5"/><text x="${X(base)}" y="${T-10}" font-size="11.5" text-anchor="middle" fill="var(--text)">hoje: ${kR(base)}</text>`;
  return svg + `</svg>`;
}
// Mapa de calor (C6): fundo por faixa de lucro (vermelho = prejuízo, verde = lucro, neutro perto de zero)
function heatStyle(v, maxAbs){
  const a = Math.min(1, Math.abs(v)/Math.max(1, maxAbs))*0.5;
  return `background:${v<0 ? `rgba(179,38,30,${a.toFixed(2)})` : `rgba(46,125,79,${a.toFixed(2)})`}`;
}

  const valAparelhos = p.modelo==="seminovos" ? p.seminovosValor : (p.modelo==="leasing" ? 0 : p.novosValor);

  // ----- Aba Como calculamos -----
  const como = `
    <div class="card"><h3>Glossário</h3><dl class="gloss">
      <dt>Ponto de equilíbrio (alunos para empatar)</dt><dd>Número de alunos em que o faturamento cobre exatamente todos os custos. Abaixo dele há prejuízo.</dd>
      <dt>Vagas no studio (lotação)</dt><dd>Quantos alunos ativos cabem, considerando horário, espaço, quantas vezes cada um treina e o vazio fora do pico.</dd>
      <dt>Dinheiro necessário</dt><dd>O pior saldo do caixa: obra, aparelhos e os prejuízos dos primeiros meses, antes de o negócio andar sozinho.</dd>
      <dt>Tempo para recuperar (payback)</dt><dd>Meses, a partir da inauguração, até o lucro acumulado devolver tudo o que foi investido.</dd>
      <dt>Valor do negócio hoje (VPL)</dt><dd>Todo o dinheiro que o negócio gera, trazido para valores de hoje usando o rendimento mínimo desejado. Positivo = rende mais que a aplicação alternativa.</dd>
      <dt>Rentabilidade anual (TIR)</dt><dd>Quanto o dinheiro investido rende por ano, em média. Compare com o rendimento mínimo desejado.</dd>
      <dt>Depreciação</dt><dd>Desgaste da obra e dos aparelhos ao longo dos anos. Não sai do caixa, mas reduz o lucro contábil.</dd>
      <dt>Rampa</dt><dd>Período em que os alunos e os aluguéis de sala crescem aos poucos até a meta.</dd>
    </dl></div>
    <div class="card"><h3>Fórmulas</h3><ul class="note" style="font-size:13.5px">
      <li>Horas abertas = (fecha − abre) × dias, somando semana, sábado e domingo.</li>
      <li>Alunos ao mesmo tempo: informado (recomendado 9). Área de treino necessária = alunos ao mesmo tempo × espaço por aluno; comparada com a área livre da planta.</li>
      <li>Balanço por área: custos do imóvel e custos comuns (recepção, limpeza, contas, sistema, contador, seguro, outros) divididos entre studio e salas pela área de cada andar; instrutores, aparelhos, divulgação e custos dos alunos ficam no studio; impostos, custos por hora e lixo hospitalar das salas ficam nas salas.</li>
      <li>Treinos por aluno = vezes por semana do mix (2x, 3x, 4–5x) × 52 ÷ 12 × (1 − taxa de faltas).</li>
      <li>Vagas = horas abertas × alunos ao mesmo tempo ÷ treinos por aluno × aproveitamento.</li>
      <li>Alunos no tempo: linha reta ou curva em S até a meta (curva em S = 3x² − 2x³, com x = mês ÷ meses até a meta); ou por captação: alunos do mês = alunos do mês anterior × (1 − cancelamento) + novos. A base estável da captação é novos ÷ cancelamento. Com "limitar às vagas", nunca passa da lotação.</li>
      <li>Capital recomendado = dinheiro que vocês precisam ter + reserva (meses × custos fixos do mês).</li>
      <li>Meta inversa: busca o menor nº de alunos, aumento de preço ou ocupação das salas que atinge o lucro desejado ou o prazo desejado, mudando uma alavanca de cada vez.</li>
      <li>Fôlego de caixa: primeiro mês em que o caixa acumulado dos sócios fica abaixo de −(capital dos sócios).</li>
      <li>Simulação de risco: 500 sorteios uniformes e independentes dentro das faixas dos cenários (alunos, ocupação das salas, preços, custos, tempo para encher), com semente fixa.</li>
      <li>Mensalidade média = soma de (preço × % dos alunos) × (1 − % plano longo × desconto) × (1 − não pagas).</li>
      <li>Instrutores = (horas abertas × instrutores + horas extras de pico) × custo da hora + adicional do RT.</li>
      <li>Horas das salas = (fecha − abre) × dias, com o horário próprio das salas e os mesmos dias do studio.</li>
      <li>Simples Nacional (modo automático): academia e sublocação de salas são "atividades do Fator R". Fator R = folha dos 12 meses (salários e encargos de pessoas físicas + pró-labore; MEI/PJ não contam) ÷ receita dos 12 meses. Se ≥ 28%, Anexo III; se menor, Anexo V. Alíquota efetiva = (receita dos 12 meses × alíquota da faixa − parcela a deduzir) ÷ receita dos 12 meses, sobre studio + salas. No início da atividade, usa a média dos meses já faturados × 12. A taxa de cartão é somada só no studio.</li>
      <li>Depreciação: obra dividida pelo prazo do contrato; aparelhos próprios pela vida útil (leasing não deprecia).</li>
      <li>Salas: horas alugadas = horas disponíveis × ocupação; preço médio pondera pacote, avulsa e turno; sobra = receita − impostos − taxa do app − custo por hora.</li>
      <li>Alunos para empatar: menor nº de alunos com lucro ≥ 0, testando cada nº de alunos e recalculando o Simples para o faturamento de cada um (o lucro nem sempre cresce com os alunos: o Fator R pode levar ao Anexo V). "Alunos para lucrar" usa a mesma conta. Aproximação: (custos fixos − sobra das salas − outras receitas) ÷ quanto cada aluno deixa.</li>
      <li>Caixa mês a mês: alunos crescem como escolhido em "Como os alunos chegam" (linha reta, curva em S ou captação) e a ocupação das salas em linha reta; preços, custos e aluguel sobem a cada 12 meses; carência conta da assinatura.</li>
      <li>VPL e TIR usam o caixa do negócio sem o empréstimo; "dinheiro necessário" inclui o empréstimo. No fim do período, o saldo ainda devido do financiamento dos aparelhos é descontado (e, no caixa dos sócios, também o do empréstimo). A TIR aparece como "—" quando o fluxo não tem uma única virada de negativo para positivo.</li>
      <li>Sócios: fontes = capital dos sócios (sem capital informado, o exemplo é o capital recomendado) + empréstimo; usos = investimento para abrir + aluguel durante a obra + prejuízos e parcelas do empréstimo até o pior mês + reserva. Fluxo dos sócios = −investimento para abrir + empréstimo no mês 0, resultado de cada mês (com as parcelas do empréstimo) e, no fim, caixa + caução − dívidas em aberto + venda, se houver. Só os sócios fazem parte do negócio.</li>
      <li>Retorno dos sócios: TIR e múltiplo do fluxo dos sócios. Aplicação: rendimento bruto = "Rendimento mínimo desejado", com IR regressivo (22,5% até 180 dias — até 5 meses —, 20% até 360 dias — até 11 meses —, 17,5% até 720 dias — até 23 meses —, 15% acima). Venda no ano N: lucro dos 12 meses × múltiplo de venda; resultado = caixa acumulado + venda + caução − dívidas.</li>

function svgToPng(svg){
  return new Promise((ok, fail) => {
    let s = svg.replace(/var\(--([\w-]+)\)/g, (m,n) => LIGHT[n] || "#000")
      .replace(/<line id="cx"[^>]*\/>/, "").replace(/<circle id="cdot"[^>]*\/>/, "").replace(/<rect id="hit"[^>]*\/>/, "");
    const vb = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(s), w = +vb[1], h = +vb[2];
    s = s.replace("<svg ", `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" font-family="Segoe UI, Arial, sans-serif" `);
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = w*2; c.height = h*2; const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); ok({url:c.toDataURL("image/png"), w, h}); };
    img.onerror = () => fail(new Error("Falha ao converter gráfico"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
  });
}
async function svgsToImages(html){

}
