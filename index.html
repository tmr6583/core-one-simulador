}
// ================= Quebra de páginas do PDF =================
// O html2pdf fotografa a seção inteira e corta a imagem a cada altura de página. Antes disso, a seção é montada
// fora da tela com a mesma largura do PDF e cada bloco que cruzaria o corte é empurrado para a página seguinte:
// linhas de tabela, parágrafos, gráficos, indicadores e cartões pequenos nunca são cortados; títulos ficam junto
// do que vem depois; tabelas longas continuam na página seguinte com o cabeçalho repetido; cartões longos
// continuam em um cartão novo com o título e "(continuação)"; tabela não deixa só 1 linha em uma das páginas.
const A4_MM = [595.28/72*25.4, 841.89/72*25.4];
function geometriaPdf(margin, scale){
  const iw = A4_MM[0] - margin[1] - margin[3], ih = A4_MM[1] - margin[0] - margin[2];
  return {largura: iw + "mm", altura: cw => { const c = Math.ceil(cw)*scale; return Math.floor(c*ih/iw)/scale; }};
}
const PB_ATOMO = "tr,p,li,img,svg,h1,h2,h3,h4,.big,.bigs,.ind,.hbar,.alert,.verdict,.cover,.chartbox,.legend,.pbox,.pgrid,.pcalc,.rmat,.prop,.meter,.ex";
function paginar(root, H){
  const G = 14; // folga no pé da página: o fundo e a borda do cartão também cabem antes do corte
  const mede = el => { const r = el.getBoundingClientRect(), t = root.getBoundingClientRect().top; return {top: r.top - t, bottom: r.bottom - t, h: r.height}; };
  const disp = el => el ? getComputedStyle(el).display : "block";
  const ignora = el => el.tagName==="STYLE" || el.classList.contains("pb-sp");
  const filhos = el => [...el.children].filter(c => !ignora(c) && c.getBoundingClientRect().height >= 1);
  const presos = new WeakSet(); // blocos que já começam no topo e mesmo assim não cabem: ficam como estão
  const ehGrade = el => /grid/.test(disp(el)) && !el.matches(PB_ATOMO);
  const folha = el => el.matches(PB_ATOMO) || !el.firstElementChild;
  const atomo = (el, h) => folha(el) || (el.matches(".card") && h <= H*0.42) || (el.tagName==="TABLE" && h <= H*0.22) || (ehGrade(el) && h <= H*0.5);
  const primeiro = el => { let x = el.previousElementSibling; while(x && ignora(x)) x = x.previousElementSibling; return !x; };
  const fimDaPagina = top => (Math.floor((top + 1)/H) + 1)*H;
  function procura(box){
    for(const el of filhos(box)){
      const m = mede(el), fim = fimDaPagina(m.top);
      if(atomo(el, m.h)){
        if(m.bottom <= fim - (folha(el) ? G : -0.5)) continue; // cartão/tabela inteiros: já incluem o próprio fundo
        if((m.h <= H - G - 8 || el.matches(".pgrid")) && !presos.has(el)) return el;
        continue;
      }
      if(m.bottom <= fim + 0.5) continue;
      if(ehGrade(el)){ // grade (colunas lado a lado): quebra entre linhas da grade, nunca dentro de uma coluna
        const linhas = [];
        for(const c of filhos(el)){ const t = Math.round(mede(c).top), l = linhas.find(x => Math.abs(x.t - t) < 2); if(l) l.itens.push(c); else linhas.push({t, itens:[c]}); }
        for(const l of linhas){
          const bot = Math.max(...l.itens.map(c => mede(c).bottom)), f = fimDaPagina(l.t);
          if(bot <= f - G) continue;
          if(bot - l.t <= H - G - 8 && !presos.has(l.itens[0])) return l.itens[0];
          for(const c of l.itens){ const r = procura(c); if(r) return r; }
        }
        continue;
      }
      const dentro = procura(el); if(dentro) return dentro;
    }
    return null;
  }
  function inicio(el){
    if(el.tagName==="TR"){ // não deixa 1 linha sozinha em nenhuma das páginas
      const rows = [...el.parentElement.children], cab = rows[0] && [...rows[0].children].every(c => c.tagName==="TH") ? 1 : 0;
      let i = rows.indexOf(el);
      if(rows.length - i < 2 && i - cab >= 3) i = rows.length - 2;
      el = i - cab < 2 ? rows[0] : rows[i];
    }
    let x = el.previousElementSibling; // títulos e subtítulos vão junto
    while(x && (ignora(x) || x.matches("h1,h2,h3,h4,.sub,.legend"))){ if(!ignora(x)) el = x; x = x.previousElementSibling; }
    return el;
  }
  function divideTabela(corpo, linha){
    const tab = corpo.parentElement, nt = tab.cloneNode(false), nc = corpo.cloneNode(false);
    nt.removeAttribute("id");
    const thead = tab.querySelector(":scope > thead"), cab = corpo.firstElementChild;
    if(thead && corpo.tagName!=="THEAD") nt.append(thead.cloneNode(true));
    else if(cab && cab!==linha && [...cab.children].every(c => c.tagName==="TH")) nc.append(cab.cloneNode(true));
    let x = linha; while(x){ const n = x.nextElementSibling; nc.append(x); x = n; }
    nt.append(nc); tab.after(nt); return nt;
  }
  function divideBloco(par, el){
    const nb = par.cloneNode(false); nb.removeAttribute("id"); nb.classList.add("pb-cont");
    const h = [...par.children].find(c => !ignora(c));
    if(h && h.tagName==="H3" && h!==el){ const t = h.cloneNode(true); t.querySelectorAll(".pb-c").forEach(x => x.remove()); t.insertAdjacentHTML("beforeend", '<small class="pb-c"> (continuação)</small>'); nb.append(t); }
    let x = el; while(x){ const n = x.nextElementSibling; nb.append(x); x = n; }
    par.after(nb); return nb;
  }
  function empurra(el, alvo, comoMargem){
    let sp = null;
    if(comoMargem) el.dataset.pbMt = el.dataset.pbMt || getComputedStyle(el).marginTop;
    else { sp = document.createElement("div"); sp.className = "pb-sp"; sp.setAttribute("aria-hidden", "true"); el.before(sp); }
    let extra = 0;
    for(let k=0; k<4; k++){
      const d = alvo - mede(el).top; if(Math.abs(d) < 0.5) break;
      extra = Math.max(0, extra + d);
      if(sp) sp.style.height = extra + "px"; else el.style.marginTop = `calc(${el.dataset.pbMt} + ${extra}px)`;
    }
  }
  // Premissas em 3 colunas (.pgrid): passa as últimas caixas para uma grade nova na página seguinte
  function dividePgrid(g, p0, alvo){
    const ng = g.cloneNode(false); ng.classList.add("pb-cont"); g.after(ng);
    while(g.firstElementChild && mede(g).bottom > (p0 + 1)*H - G) ng.prepend(g.lastElementChild);
    if(!g.firstElementChild) g.remove();
    if(!ng.firstElementChild){ ng.remove(); presos.add(g); return; }
    if(mede(ng).top - p0*H < 4){ presos.add(ng); return; }
    empurra(ng, alvo);
  }
  function quebraAntes(el){
    const p0 = Math.floor((mede(el).top + 1)/H), alvo = (p0 + 1)*H + 3; // vai para o topo da página seguinte
    if(el.matches(".pgrid")){ dividePgrid(el, p0, alvo); return; }
    let cur = inicio(el);
    for(;;){
      const par = cur.parentElement;
      if(par !== root && primeiro(cur)){
        const sobe = par.tagName==="TBODY" || par.tagName==="THEAD" ? par.parentElement : par;
        if(mede(sobe).top >= p0*H - 1){ cur = inicio(sobe); continue; }
      }
      const m = mede(cur);
      if(m.top - p0*H < 4 && m.top >= p0*H - 1){ presos.add(el); return; } // já está no topo da página
      if(par === root){ empurra(cur, alvo); return; }
      if(par.tagName==="TBODY" || par.tagName==="THEAD"){ cur = divideTabela(par, cur); continue; }
      const dp = disp(par);
      if(/flex/.test(dp)){ empurra(cur, alvo, true); return; }
      if((/grid/.test(dp) || /^(block|flow-root)$/.test(dp)) && !/grid|flex/.test(disp(par.parentElement)) && !par.matches(".pgrid")){ cur = divideBloco(par, cur); continue; }
      if(/grid/.test(dp)){ empurra(cur, alvo, true); return; }
      empurra(cur, alvo); return;
    }
  }
  for(let n=0; n<400; n++){ const el = procura(root); if(!el) break; quebraAntes(el); }
}
// Monta a seção fora da tela, quebra as páginas e devolve o elemento pronto para o html2pdf
async function secaoPaginada(html, opt){
  const g = geometriaPdf(opt.margin, opt.html2canvas.scale);
  const host = document.createElement("div");
  host.style.cssText = `position:absolute;left:-12000px;top:0;width:${g.largura};background:#fff`;
  host.innerHTML = html; document.body.appendChild(host);
  await Promise.all([...host.querySelectorAll("img")].map(i => i.decode ? i.decode().catch(() => {}) : null));
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const el = host.firstElementChild;
  paginar(el, g.altura(host.getBoundingClientRect().width));
  return {el, fim: () => host.remove()};
}
// Gera o PDF seção por seção (cada seção começa em página nova) e escreve o rodapé em todas as páginas
async function montaPdf(secoes, opt, rodape){
  const prontas = [];
  try { for(const sec of secoes) prontas.push(await secaoPaginada(sec, opt)); }
  catch(e){ prontas.forEach(s => s.fim()); throw e; }
  const o = {...opt, pagebreak:{mode:[], before:[], after:[], avoid:[]}};
  let w = html2pdf().set(o).from(prontas[0].el).toPdf();
  for(const sec of prontas.slice(1)) w = w.get("pdf").then(pdf => { pdf.addPage(); }).from(sec.el).toContainer().toCanvas().toPdf();
  // devolvido dentro de um objeto: o "worker" do html2pdf é thenable e seria consumido pelo await
  return {worker: w.get("pdf").then(pdf => {
    prontas.forEach(s => s.fim());
    const n = pdf.internal.getNumberOfPages(), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
    for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(110); pdf.text(rodape(i, n), W/2, H - opt.margin[2] + 8, {align:"center"}); }
  })};
}
async function buildPdf(){
  const {secoes, agora, quando} = await buildSections();
  await loadScript(PDF_LIB);
  const opt = {
    margin:[10,8,14,8], filename:`core-one-simulacao-${agora.toISOString().slice(0,10)}.pdf`,
    image:{type:"jpeg", quality:0.95},
    html2canvas:{scale:2, backgroundColor:"#ffffff", scrollX:0, scrollY:0},
    jsPDF:{unit:"mm", format:"a4", orientation:"portrait"},
  };
  return await montaPdf(secoes, opt, (i, n) => `Core One · Simulação de ${quando} · Simulador ${VERSAO.app} · padrões de ${VERSAO.padroes} · página ${i} de ${n}`);
}
document.getElementById("btnPdf").onclick = async () => {
  const b = document.getElementById("btnPdf"), txt = b.textContent;
  b.disabled = true; b.textContent = "Gerando PDF…";
  try { const {worker} = await buildPdf(); await worker.save(); }
  catch(e){
    console.error(e);
    if(confirm("Não foi possível gerar o PDF direto (a biblioteca de PDF precisa de internet).\n\nAbrir a versão para impressão? Na janela que abrir, escolha \"Salvar como PDF\" como impressora.")){
      try { await printReport(); } catch(e2){ console.error(e2); alert("Também não foi possível abrir a impressão: " + e2.message); }
    }
  }
  finally { b.disabled = false; b.textContent = txt; }
};
// Alternativa sem internet: imprime o mesmo relatório por um iframe oculto (o navegador salva em PDF)
async function printReport(doPrint = true, secoesProntas){
  const secoes = secoesProntas || (await buildSections()).secoes;
  const css = document.querySelector("head style").outerHTML;
  const printCss = `<style>@page{size:A4;margin:10mm 8mm}html,body{background:#fff!important;margin:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}.rep{width:auto}.rep+.rep{break-before:page}
    tr,p,li,.ind,.hbar,.alert,img,.big,.verdict,.cover,h3,h4,.legend,.pbox,.pcalc,.rmat,.indbox,.chartbox,.card:has(.chartbox){break-inside:avoid}
    h2,h3,h4,.sub,.legend{break-after:avoid}</style>`;
  const fr = document.createElement("iframe");
  fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(fr);
  const doc = fr.contentDocument;
  doc.open(); doc.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Core One — Simulação</title>${css}${printCss}</head><body>${secoes.join("")}</body></html>`); doc.close();
  await new Promise(r => setTimeout(r, 400));
  if(!doPrint) return fr; // usado só em testes
  fr.contentWindow.focus(); fr.contentWindow.print();
  setTimeout(() => fr.remove(), 60000);
}

document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();
document.getElementById("fileImport").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t => { try{ const c = lerArquivoCenario(JSON.parse(t));
      aplicarMudancas(c.premissas, c.nome);
      if(confirm(`Cenário "${c.nome}" carregado. Gravar também em "Meus cenários"?`)){ const l = lerCenarios().filter(x => x.nome !== c.nome); l.unshift(cenarioArquivo(c.nome, P)); gravarCenarios(l); renderInputs(); }
    }catch(err){ alert("Arquivo inválido."); } });
  e.target.value = "";
};

document.getElementById("rodape").textContent = `Core One · ${textoVersao()} · Estimativas: não substituem orçamento de obra, parecer contábil ou validação da Vigilância Sanitária.`;
renderInputs(); renderResults();
