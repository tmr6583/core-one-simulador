<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#f1f0ea; --text:#12263f; --muted:#5b6676;
  --border:#dedcd3; --brand:#0b2636; --accent:#3f7f66; --accent-weak:#e4efe9; --gold:#a08a5a;
  --ok:#2e7d4f; --ok-weak:#e6f3eb; --warn:#9a6a00; --warn-weak:#fdf4dc; --bad:#b3261e; --bad-weak:#fbeae8;
  --chart-line:#3f7f66; --chart-fill:rgba(63,127,102,.12); --grid:#e7e5dd;
  --s-in:#2f8c64; --s-res:#3f6fb5; --s-out:#c0832a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1726; --surface:#12223a; --surface-2:#192c47; --text:#e8eef5; --muted:#9fb0c4;
    --border:#243a57; --accent:#7fbfa3; --accent-weak:#173a33; --gold:#c9a96e;
    --ok:#5cc08a; --ok-weak:#123326; --warn:#e0ae3c; --warn-weak:#33290f; --bad:#f2786d; --bad-weak:#3a1a1a;
    --chart-line:#7fbfa3; --chart-fill:rgba(127,191,163,.14); --grid:#22364f;
    --s-in:#4fa880; --s-res:#5f8bd0; --s-out:#bd8028;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1726; --surface:#12223a; --surface-2:#192c47; --text:#e8eef5; --muted:#9fb0c4;
  --border:#243a57; --accent:#7fbfa3; --accent-weak:#173a33; --gold:#c9a96e;
  --ok:#5cc08a; --ok-weak:#123326; --warn:#e0ae3c; --warn-weak:#33290f; --bad:#f2786d; --bad-weak:#3a1a1a;
  --chart-line:#7fbfa3; --chart-fill:rgba(127,191,163,.14); --grid:#22364f;
  --s-in:#4fa880; --s-res:#5f8bd0; --s-out:#bd8028;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1872px;margin:0 auto;padding:0 16px}

/* Cabeçalho da marca */
.brandbar{background:var(--brand);color:#fff}
.brandbar .wrap{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{height:64px;width:auto;flex:0 0 auto;border-radius:10px;display:block}
.brandbar h1{margin:0;font-size:22px;letter-spacing:.2px}
.brandbar p{margin:2px 0 0;color:#c8d3e0;font-size:13px}
.brandbar .actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.brandbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.brandbar .btn:hover{background:rgba(255,255,255,.1)}
.brandbar .btn.primary{background:#7fbfa3;color:#10223a;border-color:#7fbfa3;font-weight:600}

/* Herói */
.hero{margin:16px auto 0}
.verdict{border-radius:14px;padding:14px 18px;border:1px solid;display:flex;gap:12px;align-items:flex-start}
.verdict .ic{font-size:22px;line-height:1}
.verdict b{display:block;font-size:17px}
.verdict span{color:var(--muted);font-size:14px}
.bigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:900px){.bigs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.bigs{grid-template-columns:1fr}}
.big{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.big .q{font-size:13px;color:var(--muted)}
.big .a{font-size:26px;font-weight:700;margin:2px 0;letter-spacing:-.3px}
.big .d{font-size:12.5px;color:var(--muted)}
.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* Layout principal */
main.wrap{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px;padding-bottom:48px}
@media (max-width:1000px){main.wrap{grid-template-columns:1fr}}
#inputs{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding-right:4px}
@media (max-width:1000px){#inputs{position:static;max-height:none;overflow:visible}}
.side-head{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.side-head h2{margin:0 0 4px;font-size:16px}
.side-head p{margin:0 0 10px;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.changed-note{font-size:12px;color:var(--muted);margin-top:8px}

details.grp{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.grp>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;align-items:center;gap:10px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .t{font-weight:650}
details.grp>summary .s{display:block;font-size:12px;color:var(--accent);font-weight:500}
details.grp>summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.grp[open]>summary::after{content:"－"}
.gintro{margin:0 14px 6px;font-size:13px;color:var(--muted)}
.field{padding:10px 14px;border-top:1px solid var(--border)}
.field .row{display:flex;align-items:center;gap:10px}
.field label{flex:1;font-weight:550;font-size:14px}
.field .inp{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.field input,.field select{width:118px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;text-align:right}
.field select{width:190px;text-align:left}
.field .u{font-size:12px;color:var(--muted);min-width:44px}
.field .help{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.field.changed input,.field.changed select{border-color:var(--warn);background:var(--warn-weak)}
.field .reset{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;margin-top:3px;display:none}
.field.changed .reset{display:inline}
.field.hidden,.field.adv-hidden{display:none}

/* Abas */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
:root[data-theme="dark"] .tabs button.on{background:var(--accent);color:#0b1726}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button.on{background:var(--accent);border-color:var(--accent);color:#0b1726}}
.tab{display:none}.tab.on{display:block}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 2px;font-size:16px}
.card .sub{margin:0 0 10px;color:var(--muted);font-size:13px}
.alert{border-radius:10px;padding:9px 12px;margin:7px 0;font-size:14px;border:1px solid;display:flex;gap:8px}
.bad{background:var(--bad-weak);border-color:var(--bad)}
.warn{background:var(--warn-weak);border-color:var(--warn)}
.ok{background:var(--ok-weak);border-color:var(--ok)}
.neg{color:var(--bad)} .pos{color:var(--ok)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-weight:600;font-size:12.5px}
tr.total td{font-weight:700;border-top:2px solid var(--border)}
tr.hl td{background:var(--accent-weak)}
tr.sub td{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}

.indgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.indbox h4{margin:0 0 6px;font-size:14px;color:var(--accent)}
.ind{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.ind .l{font-size:13.5px}
.ind .l small{display:block;color:var(--muted);font-size:12px}
.ind .v{font-weight:650;text-align:right;white-space:nowrap}

.hbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 110px;gap:10px;align-items:center;padding:4px 0;font-size:13.5px}
.hbar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--chart-line);border-radius:0 4px 4px 0}
.hbar .val{text-align:right;color:var(--muted)}

.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none;white-space:nowrap}
.legend-inline{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.gloss dt{font-weight:650;margin-top:8px}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px}
</style>
</head>

const fin = v => Number.isFinite(v) ? v : 0;
const brl = v => fin(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brl2 = v => fin(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2});
const num = (v,d=0) => fin(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=1) => Number.isFinite(v) ? num(v*100,d)+"%" : "—";

const pmt = (pv,i,n) => n<=0 ? 0 : (!i ? pv/n : pv*i/(1-Math.pow(1+i,-n)));
const tempo = m => m===null ? "não se paga" : (m===1 ? "1 mês" : m<12 ? `${m} meses` : `${m} meses (${num(m/12,1)} anos)`);

// ================= Motor de cálculo =================
function deriv(p){
  const h = (a,b) => Math.max(0, b-a);
  const horasOp = h(p.abreSemana,p.fechaSemana)*p.diasUteis + h(p.abreSab,p.fechaSab)*p.sabados + h(p.abreDom,p.fechaDom)*p.domingos;
  const capSim = Math.max(0, Math.round(p.capSim));
  const areaNec = capSim*p.m2Aluno; // área de treino necessária para a turma
  const vagas = horasOp*capSim;
  const lotacao = p.aulasMes>0 ? Math.floor(vagas/p.aulasMes*p.fatorOcup/100) : 0;
  const mixSum = p.m2+p.m3+p.m45;
  const ticketBruto = (p.m2*p.p2+p.m3*p.p3+p.m45*p.p45)/100;
  const ticket = ticketBruto*(1-p.pctLongo/100*p.descLongo/100)*(1-p.inadimpl/100);
  const tecnica = (horasOp*p.instrBase + p.horasPico2)*p.custoHoraInstr + p.adicRT;
  const capLinhas = p.capObraCivil+p.capEletrica+p.capHidraulica+p.capClima+p.capPiso+p.capAcess+p.capProjeto+p.capLicencas+p.capMobiliario+p.capTI+p.capMktPre;
  const capexObra = (p.capexNaoDet + capLinhas)*(1+p.contingencia/100);
  const tT = (p.tSimples+p.tCartao)/100;
  const folha = tecnica + p.apoio + p.proLabore;
  const outrosFixos = p.condIptu+p.taxasPrediais+p.garantia+folha+p.utilidades+p.marketing+p.software+p.contador+p.seguro+p.residuos+p.outros;
  return {horasOp, capSim, areaNec, vagas, lotacao, mixSum, ticketBruto, ticket, tecnica, folha, capexObra, tT, outrosFixos};
}
function equip(p, m){
  switch(m){
    case "novos": return {capex:p.novosValor, opex:()=>p.novosManut, oneoff:()=>0, label:"manutenção dos aparelhos"};
    case "leasing": return {capex:0,
      opex:k => (p.leasingPrazo>0 && k>p.leasingPrazo) ? p.novosManut : p.leasingAluguel,
      oneoff:k => (p.leasingPrazo>0 && k===p.leasingPrazo+1) ? p.novosValor*p.leasingVRG/100 : 0, label:"aluguel dos aparelhos"};
    case "cdc": { const parc = pmt(p.novosValor-p.cdcEntrada, p.cdcTaxa/100, p.cdcPrazo);
      return {capex:p.cdcEntrada, opex:k => (k<=p.cdcPrazo ? parc : 0) + p.novosManut, oneoff:()=>0, parcela:parc, label:"parcela + manutenção dos aparelhos"}; }
    default: return {capex:p.seminovosValor, opex:()=>p.seminovosManut, oneoff:()=>0, label:"manutenção dos aparelhos"};
  }
}
function cow(p, ocup, priceF=1){
  const sf = Math.min(Math.max(p.salasFixas,0), p.salas), sh = Math.max(0, p.salas - sf);
  const horas = Math.round(p.horasSala*ocup/100);
  const pa = p.pctAvulsa/100, pt = p.pctTurno/100, pp = Math.max(0, 1-pa-pt);
  const precoMed = (p.precoHora*pp + p.precoAvulsa*pa + p.precoTurno*pt)*priceF;
  const recHora = sh*horas*precoMed, recFixo = sf*p.aluguelFixoSala*priceF, rec = recHora+recFixo;
  const imp = rec*p.tCow/100, plat = recHora*p.comissaoPlat/100, vari = sh*horas*p.custoVarHora;
  return {sh, horas, precoMed, recSala:horas*precoMed, recHora, recFixo, rec, imp, plat, vari, liq:rec-imp-plat-vari};
}
function loanPay(p, m){
  if(p.empValor<=0) return 0;
  const i = p.empTaxa/100;
  if(m<=p.empCarencia) return p.empValor*i;
  if(m<=p.empCarencia+p.empPrazo) return pmt(p.empValor, i, p.empPrazo);
  return 0;
}
function regime(p, modelo){
  const d = deriv(p), c = cow(p, p.ocupCow), eq = equip(p, modelo);
  const eqOp = eq.opex(1), opex = p.aluguel + d.outrosFixos + eqOp;
  const A = p.alunosAlvo, ch = p.churn/100, novos = A*ch;
  const recPlanos = A*d.ticket, recMat = novos*p.matricula, recT = recPlanos+recMat+p.recExtra;
  const impT = recT*d.tT, cvar = A*p.cvAluno + novos*p.cac;
  const resultado = recT - impT - cvar + c.liq - opex;
  const margAluno = d.ticket*(1-d.tT) - p.cvAluno + ch*(p.matricula*(1-d.tT) - p.cac);
  const fixoLiq = opex - c.liq - p.recExtra*(1-d.tT);
  const be = margAluno>0 ? Math.max(0, Math.ceil(fixoLiq/margAluno - 1e-9)) : Infinity;
  return {d, c, eq, eqOp, opex, A, novos, recPlanos, recMat, recT, impT, cvar, resultado, margAluno, fixoLiq, be, receitaTotal: recT + c.rec};
}
const MONTH_FIELDS = ["mesesObra","carencia","leasingPrazo","cdcPrazo","empPrazo","empCarencia","horizonte"];
function intMonths(p){ const q = {...p}; MONTH_FIELDS.forEach(k => q[k] = Math.max(0, Math.round(q[k]))); return q; }
function simulate(p0, modelo){
  const p = intMonths(p0);
  const r = regime(p, modelo), d = r.d, eq = r.eq;
  const capexTotal = d.capexObra + eq.capex;
  const upfront = capexTotal + p.luvas + p.caucao*p.aluguel;
  const im = Math.pow(1+p.tma/100, 1/12) - 1;
  const H = Math.max(12, p.horizonte);
  const flows = [-upfront];
  let cumProj = -upfront, cumSoc = -upfront + p.empValor, minSoc = cumSoc, minMes = 0, dcum = -upfront;
  let payback = null, paybackDesc = null, prevA = 0, mesLucro = null, mesesNeg = 0;
  const rows = [];
  for(let m=1; m<=H; m++){
    const yA = Math.floor((m-1)/12);
    const alug = m<=p.carencia ? 0 : p.aluguel*Math.pow(1+p.reajAluguel/100, yA);
    let proj, row;
    if(m<=p.mesesObra){
      proj = -(alug + p.condIptu + p.taxasPrediais + p.garantia);
      row = {m, fase:"Obra", alunos:null, receita:0};
    } else {
      const k = m - p.mesesObra, y = Math.floor((k-1)/12);
      const fP = Math.pow(1+p.reajPreco/100, y), fC = Math.pow(1+p.inflCustos/100, y);
      const A = p.rampa>0 ? Math.min(p.alunosAlvo, p.alunosIniciais + (p.alunosAlvo-p.alunosIniciais)*k/p.rampa) : p.alunosAlvo;
      const novos = Math.max(0, A-prevA) + prevA*p.churn/100; prevA = A;
      const fCow = p.rampaCow>0 ? Math.min(1, k/p.rampaCow) : 1;
      const c = cow(p, p.ocupCow*fCow, fP);
      const recT = A*d.ticket*fP + novos*p.matricula*fP + p.recExtra*fP;
      const custos = alug + d.outrosFixos*fC + eq.opex(k) + eq.oneoff(k) + (A*p.cvAluno + novos*p.cac)*fC;
      proj = recT*(1-d.tT) + c.liq - custos;
      row = {m, k, fase:"Funcionando", alunos:A, receita:recT + c.rec};
      if(proj<0) mesesNeg++;
      if(mesLucro===null && proj>=0) mesLucro = k;
    }
    const soc = proj - loanPay(p, m);
    cumProj += proj; cumSoc += soc;
    if(cumSoc < minSoc){ minSoc = cumSoc; minMes = m; }
    dcum += proj/Math.pow(1+im, m);
    flows.push(proj);
    if(row.k && payback===null && cumProj>=0) payback = row.k;
    if(row.k && paybackDesc===null && dcum>=0) paybackDesc = row.k;
    rows.push({...row, proj, soc, cumProj, cumSoc});
  }
  const last12 = flows.slice(-12).reduce((a,b)=>a+b,0);
  const residual = p.multSaida>0 ? Math.max(0, last12)*p.multSaida : 0;
  const caucaoVal = p.caucao*p.aluguel;
  const flowsR = flows.slice(); flowsR[flowsR.length-1] += residual + caucaoVal;
  const vpl = flowsR.reduce((s,f,i)=> s + f/Math.pow(1+im,i), 0);
  const pvFut = flowsR.slice(1).reduce((s,f,i)=> s + f/Math.pow(1+im,i+1), 0);
  return {...r, p, capexTotal, upfront, payback, paybackDesc, exposicao: Math.max(0,-minSoc), minMes, vpl, tir: irr(flowsR),
          il: upfront>0 ? pvFut/upfront : null, rows, H, mesLucro, mesesNeg, residual, caucaoVal, cumFinal: cumProj + residual + caucaoVal};
}
function irr(flows){
  const npv = rate => flows.reduce((s,f,i)=> s + f/Math.pow(1+rate,i), 0);
  let lo = -0.9, hi = 1, flo = npv(lo), fhi = npv(hi);
  if(!(flo*fhi < 0)) return null;
  for(let i=0;i<200;i++){ const mid=(lo+hi)/2, fm=npv(mid); if(flo*fm<=0){hi=mid;fhi=fm;} else {lo=mid;flo=fm;} }
  return Math.pow(1+(lo+hi)/2, 12) - 1;
}
function scenario(p, sign){
  const q = {...p}, a = p.varAlunos/100*sign, o = p.varOcup/100*sign, pr = p.varPrecos/100*sign, c = -p.varCustos/100*sign, r = -p.varRampa/100*sign;
  q.alunosAlvo = Math.round(p.alunosAlvo*(1+a)); q.alunosIniciais = Math.min(q.alunosAlvo, p.alunosIniciais);
  q.ocupCow = p.ocupCow*(1+o);
  ["p2","p3","p45","precoHora","precoAvulsa","precoTurno","aluguelFixoSala","matricula"].forEach(k => q[k] = p[k]*(1+pr));
  ["custoHoraInstr","apoio","utilidades","marketing","software","contador","seguro","residuos","outros","condIptu","taxasPrediais"].forEach(k => q[k] = p[k]*(1+c));
  q.rampa = p.rampa>0 ? Math.max(1, Math.round(p.rampa*(1+r))) : 0;
  q.rampaCow = p.rampaCow>0 ? Math.max(1, Math.round(p.rampaCow*(1+r))) : 0;
  return q;
}
function sensitivity(p){
  const base = regime(p, p.modelo), lot = q => deriv(q).lotacao;
  const items = [
    ["Preço dos planos", (q,f)=>{q.p2*=f;q.p3*=f;q.p45*=f;}],
    ["Número de alunos", (q,f)=>{q.alunosAlvo=Math.round(q.alunosAlvo*f);}],
    ["Alunos ao mesmo tempo", (q,f)=>{q.capSim=Math.round(q.capSim*f);}],
    ["Treinos por aluno no mês", (q,f)=>{q.aulasMes*=f;}],
    ["Ocupação das salas", (q,f)=>{q.ocupCow*=f;}],
    ["Preço da hora das salas", (q,f)=>{q.precoHora*=f;q.precoAvulsa*=f;q.precoTurno*=f;}],
    ["Aluguel", (q,f)=>{q.aluguel*=f;}],
    ["Condomínio + IPTU", (q,f)=>{q.condIptu*=f;}],
    ["Custo da hora do instrutor", (q,f)=>{q.custoHoraInstr*=f;}],
    ["Recepção e limpeza", (q,f)=>{q.apoio*=f;}],
    ["Energia, água e internet", (q,f)=>{q.utilidades*=f;}],
    ["Divulgação mensal", (q,f)=>{q.marketing*=f;}],
    ["Imposto (Simples)", (q,f)=>{q.tSimples*=f;}],
  ];
  return {base, lotBase: lot(p), rows: items.map(([l,fn]) => {
    const out = [0.9,1.1].map(f => { const q = {...p}; fn(q,f); const r = regime(q, q.modelo); return {res:r.resultado, be:r.be, lot:lot(q)}; });
    return {l, lo:out[0], hi:out[1], swing:Math.abs(out[1].res-out[0].res)};
  }).sort((a,b)=>b.swing-a.swing)};
}

    g.f.forEach(([id,l,u,,st,hint,ess]) => {

      h += `<div class="field${ch}" data-id="${id}" data-ess="${ess?1:0}" data-label="${(g.g+" "+l+" "+hint).toLowerCase()}">
        <div class="row"><label for="f_${id}">${l}</label><div class="inp">${ctl}<span class="u">${u}</span></div></div>
        ${hint?`<div class="help">${hint}</div>`:""}
        <button class="reset" data-id="${id}">Voltar ao valor padrão (${id==="modelo"?MODELS[DEFAULTS[id]]:num(DEFAULTS[id], DEFAULTS[id]%1?2:0)})</button></div>`;
    });
    h += `</details>`;
  });
  el.innerHTML = h;
  el.querySelectorAll(".field input").forEach(inp => inp.addEventListener("input", e => {
    const id = e.target.id.slice(2), v = parseFloat(e.target.value);
    if(!isNaN(v)){ P[id]=v; e.target.closest(".field").classList.toggle("changed", v!==DEFAULTS[id]); save(); renderResults(); if(FIELDS[id].g==="equip") applyFilter(); }
  }));
  document.getElementById("f_modelo").addEventListener("change", e => {
    P.modelo = e.target.value; e.target.closest(".field").classList.toggle("changed", P.modelo!==DEFAULTS.modelo); save(); renderResults(); applyFilter();
  });
  el.querySelectorAll(".reset").forEach(b => b.addEventListener("click", () => { P[b.dataset.id] = DEFAULTS[b.dataset.id]; save(); renderInputs(); renderResults(); }));
  el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { UI.modo = b.dataset.modo; saveUI(); applyFilter(); }));
  document.getElementById("search").addEventListener("input", applyFilter);
  applyFilter();
}

function applyFilter(){

// ================= Interface: resultados =================
function verdict(p, s){
  const d = s.d, beOk = Number.isFinite(s.be) && s.be <= d.lotacao;
  if(!beOk || s.resultado<=0) return ["bad","✕","Com estas premissas, o negócio não se sustenta.", Number.isFinite(s.be) ? `Precisaria de ${s.be} alunos para empatar, mas só cabem ${d.lotacao}.` : "Cada aluno custa mais do que paga."];
  if(s.payback===null) return ["bad","✕","Dá lucro quando estiver cheio, mas o investimento não volta.", `Com lucro de ${brl(s.resultado)}/mês e ${p.alunosAlvo} alunos, os ${brl(s.exposicao)} que precisam ser colocados não voltam em ${num(s.H/12,0)} anos.`];
  if(s.vpl<0) return ["warn","!","O investimento volta, mas rende menos do que outra aplicação.", `Recupera em ${tempo(s.payback)}, porém rende abaixo dos ${num(p.tma,1)}% ao ano desejados.`];
  if(s.be/d.lotacao>0.7 || (p.capital>0 && p.capital<s.exposicao)) return ["warn","!","Viável, mas com risco alto.", `Precisa de ${pct(s.be/d.lotacao,0)} das vagas ocupadas para empatar${p.capital>0 && p.capital<s.exposicao?` e faltam ${brl(s.exposicao-p.capital)} de capital`:""}.`];
  return ["ok","✓","Viável com estas premissas.", `Recupera o investimento em ${tempo(s.payback)} e rende ${s.tir===null?"—":pct(s.tir,0)} ao ano.`];
}
function alerts(p, s){
  const a = [], d = s.d;
  if(Math.abs(d.mixSum-100)>0.01) a.push(["bad",`Os três planos somam ${num(d.mixSum,1)}% dos alunos. Ajuste para somar 100%.`]);
  if(p.pctAvulsa+p.pctTurno>100) a.push(["bad","Horas avulsas + turno fixo passam de 100% das horas alugadas."]);
  if(p.salasFixas>p.salas) a.push(["bad","Há mais salas em contrato mensal do que salas existentes."]);
  if(d.areaNec > p.areaUtilTerreo + 0.01) a.push(["warn",`${d.capSim} alunos × ${num(p.m2Aluno,1)} m² = ${num(d.areaNec)} m² de área livre para treinar, mas a estimativa do térreo é de ${num(p.areaUtilTerreo)} m². Confirmar com a planta.`]);
  const areaTreino = Math.max(p.areaUtilTerreo, d.areaNec);
  if(areaTreino > p.areaBrutaTerreo) a.push(["bad",`A área de treino (${num(areaTreino)} m²) é maior que o térreo inteiro (${p.areaBrutaTerreo} m²).`]);
  else if(areaTreino > p.areaBrutaTerreo*0.8) a.push(["warn",`A área de treino (${num(areaTreino)} m²) ocupa ${pct(areaTreino/p.areaBrutaTerreo,0)} do térreo. Sobra pouco para recepção, escada e banheiros.`]);
  const area = p.salaLarg*p.salaComp, menor = Math.min(p.salaLarg,p.salaComp);
  if(area < 7.5 || menor < 2.2) a.push(["warn",`Cada sala tem ${num(area,2)} m². A norma da Anvisa (RDC 50) pede 7,5 m² e lado mínimo de 2,2 m para consultório. O projeto prevê salas só de terapia; depende de aceite da Vigilância Sanitária.`]);
  if(p.salas*area > p.areaBruta2*0.7) a.push(["warn",`As salas ocupam ${pct(p.salas*area/p.areaBruta2,0)} do 2º andar. Sobra pouco para escada, corredor e espera.`]);
  if(p.alunosAlvo > d.lotacao) a.push(["bad",`A meta de ${p.alunosAlvo} alunos é maior do que cabe no studio (${d.lotacao}). Reduza a meta ou aumente horário/área.`]);
  if(Number.isFinite(s.be) && s.be <= d.lotacao && s.be/d.lotacao > 0.7) a.push(["warn",`Para empatar é preciso ocupar ${pct(s.be/d.lotacao,0)} das vagas. Pouca folga se os alunos demorarem a vir.`]);
  if(p.capital>0 && p.capital < s.exposicao) a.push(["bad",`O capital dos sócios (${brl(p.capital)}) não cobre o dinheiro necessário (${brl(s.exposicao)}). Faltam ${brl(s.exposicao-p.capital)}.`]);
  if(p.capital===0) a.push(["warn","O capital disponível dos sócios ainda não foi informado (grupo \"Dinheiro dos sócios\")."]);
  if(Math.max(0,p.fechaSemana-p.abreSemana)===0 && Math.max(0,p.fechaSab-p.abreSab)===0) a.push(["bad","O studio está sem horário de funcionamento."]);
  if([p.abreSemana,p.fechaSemana,p.abreSab,p.fechaSab,p.abreDom,p.fechaDom].some(v => v<0 || v>24)) a.push(["bad","Há horário de abertura ou fechamento fora do intervalo de 0 a 24 h."]);
  if(p.horasPico2 > d.horasOp) a.push(["warn",`As horas com instrutor extra (${num(p.horasPico2)}) passam das horas abertas no mês (${num(d.horasOp)}).`]);
  if(p.horasSala > d.horasOp + 0.01) a.push(["warn",`Cada sala está disponível ${num(p.horasSala)} h/mês, mais que as ${num(d.horasOp)} h em que o studio fica aberto. Recepção e limpeza estão dimensionadas para o horário do studio.`]);
  if(p.fatorOcup>100 || p.ocupCow>100) a.push(["bad","Aproveitamento dos horários ou ocupação das salas acima de 100%."]);
  if(p.alunosIniciais > p.alunosAlvo) a.push(["warn","Há mais alunos na inauguração do que na meta. A simulação usa a meta."]);
  if(p.alunosAlvo>0 && Number.isFinite(s.be) && p.alunosAlvo >= s.be && s.be <= d.lotacao) a.push(["ok",`A meta de ${p.alunosAlvo} alunos fica ${p.alunosAlvo-s.be} acima do ponto de equilíbrio.`]);
  return a;
}
const ICON = {bad:"✕", warn:"!", ok:"✓"};

function cashChart(s){
  const rows = s.rows, W = 800, Hh = 260, L = 64, R = 16, T = 16, B = 30;
  const vals = [-s.upfront + s.p.empValor, ...rows.map(r=>r.cumSoc)];
  let mn = Math.min(0, ...vals), mx = Math.max(0, ...vals); if(mx===mn) mx = mn+1;
  // escala com valores "redondos" no eixo
  const raw = (mx-mn)/5, mag = Math.pow(10, Math.floor(Math.log10(raw))), nrm = raw/mag;
  const step = (nrm<=1?1:nrm<=2?2:nrm<=2.5?2.5:nrm<=5?5:10)*mag;
  mn = Math.floor(mn/step)*step; mx = Math.ceil(mx/step)*step;
  const x = i => L + i*(W-L-R)/(vals.length-1), y = v => T + (mx-v)*(Hh-T-B)/(mx-mn);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const tv = []; for(let v=mn; v<=mx+step/2; v+=step) tv.push(v);
  const kfmt = v => (Math.abs(v)>=1000? num(v/1000,0)+" mil" : num(v,0));
  let svg = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Caixa acumulado dos sócios mês a mês">`;
  tv.forEach(v => { svg += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">R$ ${kfmt(v)}</text>`; });
  for(let i=0;i<vals.length;i+=12){ const anc = i===0?"start":(i>=vals.length-1?"end":"middle"); svg += `<text x="${x(i)}" y="${Hh-10}" font-size="11" text-anchor="${anc}" fill="var(--muted)">${i===0?"assinatura":"mês "+i}</text>`; }
  svg += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.2"/>`;
  svg += `<polygon points="${x(0)},${y(0)} ${pts.join(" ")} ${x(vals.length-1)},${y(0)}" fill="var(--chart-fill)"/>`;
  svg += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--chart-line)" stroke-width="2" stroke-linejoin="round"/>`;
  // rótulos dos marcos: à direita do ponto, ou à esquerda quando o ponto está perto da borda direita
  const lab = (i, dy, txt) => { const right = x(i) > W*0.65; return `<text x="${x(i)+(right?-8:8)}" y="${y(vals[i])+dy}" font-size="12" text-anchor="${right?"end":"start"}" fill="var(--text)">${txt}</text>`; };
  const iMin = s.minMes; svg += `<circle cx="${x(iMin)}" cy="${y(vals[iMin])}" r="5" fill="var(--bad)" stroke="var(--surface)" stroke-width="2"/>` + lab(iMin, 18, `pior momento: ${brl(vals[iMin])}`);
  const iZero = vals.findIndex((v,i)=> i>iMin && v>=0);
  if(iZero>0) svg += `<circle cx="${x(iZero)}" cy="${y(vals[iZero])}" r="5" fill="var(--ok)" stroke="var(--surface)" stroke-width="2"/>` + lab(iZero, -10, `dinheiro de volta (mês ${iZero} após a assinatura)`);
  svg += `<line id="cx" x1="0" x2="0" y1="${T}" y2="${Hh-B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle id="cdot" r="5" fill="var(--chart-line)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  svg += `<rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${Hh-T-B}" fill="transparent"/></svg>`;
  return {svg, vals, x, y, W, L, R};
}
function bindChart(ch, s){
  const box = document.getElementById("chartbox"); if(!box || !box.querySelector) return;
  const svg = box.querySelector("svg"); if(!svg) return;
  const hit = svg.getElementById("hit"), line = svg.getElementById("cx"), dot = svg.getElementById("cdot"), tip = box.querySelector(".tip");
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * ch.W / r.width;
    const i = Math.max(0, Math.min(ch.vals.length-1, Math.round((sx - ch.L)/((ch.W-ch.L-ch.R)/(ch.vals.length-1)))));
    const X = ch.x(i), Y = ch.y(ch.vals[i]);
    line.setAttribute("x1",X); line.setAttribute("x2",X); line.setAttribute("visibility","visible");
    dot.setAttribute("cx",X); dot.setAttribute("cy",Y); dot.setAttribute("visibility","visible");
    const row = s.rows[i-1];
    tip.innerHTML = i===0 ? `<b>Assinatura</b><br>Saída inicial: ${brl(-s.upfront)}${s.p.empValor>0?`<br>Empréstimo recebido: ${brl(s.p.empValor)}`:""}` : `<b>Mês ${i} após a assinatura</b> · ${row.fase}${row.alunos!=null?` · ${num(row.alunos)} alunos`:""}<br>Resultado do mês: ${brl(row.soc)}<br>Caixa acumulado: ${brl(ch.vals[i])}`;
    tip.style.display = "block";
    const px = X * r.width / ch.W, py = Y * r.height / 260;
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = Math.max(0, py - 60) + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; line.setAttribute("visibility","hidden"); dot.setAttribute("visibility","hidden"); });
}

// Balanço mensal por unidade: custos comuns rateados pela área de cada andar
function balanco(p, s){
  const d = s.d, areaTot = p.areaBrutaTerreo + p.areaBruta2;
  const share = areaTot>0 ? p.areaBruta2/areaTot : 0;
  const comuns = p.aluguel+p.condIptu+p.taxasPrediais+p.garantia+p.apoio+p.proLabore+p.utilidades+p.software+p.contador+p.seguro+p.outros;
  const studioDir = s.impT + s.cvar + d.tecnica + s.eqOp + p.marketing;
  const cowDir = s.c.imp + s.c.vari + s.c.plat + p.residuos;
  const st = {nome:"Studio (ginásio)", ent:s.recT, sai:studioDir + comuns*(1-share)};
  const cw = {nome:"Salas (coworking)", ent:s.c.rec, sai:cowDir + comuns*share};
  const tt = {nome:"Negócio total", ent:st.ent+cw.ent, sai:st.sai+cw.sai};
  [st,cw,tt].forEach(u => u.res = u.ent - u.sai);
  return {share, comuns, rows:[st,cw,tt]};
}
function balanceChart(b){
  const W = 800, H = 290, L = 70, R = 16, T = 26, B = 40;
  const series = [["ent","Entradas","var(--s-in)"],["sai","Saídas","var(--s-out)"],["res","Resultado","var(--s-res)"]];
  const vals = b.rows.flatMap(u => series.map(([k]) => u[k]));
  let mn = Math.min(0, ...vals), mx = Math.max(0, ...vals); if(mx===mn) mx = 1;
  const raw = (mx-mn)/5, mag = Math.pow(10, Math.floor(Math.log10(raw))), nrm = raw/mag;
  const step = (nrm<=1?1:nrm<=2?2:nrm<=2.5?2.5:nrm<=5?5:10)*mag;
  mn = Math.floor(mn/step)*step; mx = Math.ceil(mx/step)*step;
  const y = v => T + (mx-v)*(H-T-B)/(mx-mn), y0 = y(0);
  const gw = (W-L-R)/b.rows.length, bw = Math.min(64, gw/4.2), gap = 2;
  const k = v => Math.abs(v)<0.5 ? "R$ 0" : "R$ " + num(v/1000, Math.abs(v)<10000?1:0) + " mil";
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balanço mensal: entradas, saídas e resultado do studio, das salas e do negócio total">`;
  for(let v=mn; v<=mx+step/2; v+=step) svg += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${k(v)}</text>`;
  svg += `<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--muted)" stroke-width="1.2"/>`;
  b.rows.forEach((u,gi) => {
    const gx = L + gi*gw + (gw - (3*bw + 2*gap))/2;
    series.forEach(([key,name,col],si) => {
      const v = u[key], x = gx + si*(bw+gap), yv = y(v), r = Math.min(4, bw/2, Math.abs(y0-yv));
      const path = yv<y0
        ? `M${x},${y0}V${yv+r}Q${x},${yv} ${x+r},${yv}H${x+bw-r}Q${x+bw},${yv} ${x+bw},${yv+r}V${y0}Z`
        : `M${x},${y0}V${yv-r}Q${x},${yv} ${x+r},${yv}H${x+bw-r}Q${x+bw},${yv} ${x+bw},${yv-r}V${y0}Z`;
      svg += `<path d="${path}" fill="${col}"><title>${u.nome} · ${name}: ${brl(v)}</title></path>`;
      const ly = v>=0 ? yv-6 : yv+14;
      svg += `<text x="${x+bw/2}" y="${ly}" font-size="11.5" text-anchor="middle" fill="var(--text)" font-weight="${key==="res"?700:500}">${k(v)}</text>`;
    });
    svg += `<text x="${L + gi*gw + gw/2}" y="${H-12}" font-size="13" text-anchor="middle" fill="var(--text)" font-weight="600">${u.nome}</text>`;
  });
  return svg + `</svg>`;
}

function renderResults(){

  const alunosLucro = s.margAluno>0 ? Math.ceil((s.fixoLiq + p.lucroAlvo)/s.margAluno - 1e-9) : Infinity;

  const beFrac = Number.isFinite(s.be) ? s.be/Math.max(1,d.lotacao) : Infinity;

  // Veredito e números principais
  const [vt, vi, vh, vd] = verdict(p, s);
  document.getElementById("verdict").innerHTML = `<div class="verdict ${vt}"><div class="ic">${vi}</div><div><b>${vh}</b><span>${vd}</span></div></div>`;
  const meterCls = beFrac>1 ? "bad" : beFrac>0.7 ? "warn" : "";
  document.getElementById("bigs").innerHTML = `
    <div class="big"><div class="q">Lucro por mês com ${p.alunosAlvo} alunos</div><div class="a">${sgn(s.resultado)}</div><div class="d">Depois de impostos e todos os custos, com o studio maduro.</div></div>

  // ----- Aba Resumo -----

    </table></div><p class="note">Financiamento: parcela de ${brl2(equip(p,"cdc").parcela)} por ${p.cdcPrazo} meses, mais manutenção. Leasing: ${p.leasingPrazo>0?`${p.leasingPrazo} meses e ${num(p.leasingVRG,0)}% do preço novo para ficar com os aparelhos`:"aluguel contínuo, com manutenção inclusa"}.</p></div>
    <div class="card"><h3>Salas: quanto rende cada nível de ocupação</h3><p class="sub">${p.salas} salas a ${brl(s.c.precoMed)}/hora em média.</p><div class="scroll"><table>
      <tr><th>Ocupação</th><th>Horas por sala</th><th>Receita por sala</th><th>Receita total</th><th>Sobra (sem impostos e custos)</th><th>Paga do aluguel</th><th>Lucro do negócio</th></tr>
      ${[...new Set([10,15,20,25,30,45,60,p.ocupCow])].sort((a,b)=>a-b).map(o=>{ const c=cow(p,o); const r=regime({...p, ocupCow:o},p.modelo); return `<tr${o===p.ocupCow?' class="hl"':''}><td>${num(o,0)}%</td><td>${c.horas} h</td><td>${brl(c.recSala)}</td><td>${brl(c.rec)}</td><td>${brl(c.liq)}</td><td>${pct(c.liq/Math.max(1,p.aluguel),0)}</td><td>${sgn(r.resultado)}</td></tr>`;}).join("")}
      <tr class="sub"><td>Todas em contrato mensal de ${brl(p.aluguelFixoSala)}</td><td>—</td><td>${brl(p.aluguelFixoSala)}</td><td>${brl(p.aluguelFixoSala*p.salas)}</td><td>${brl(p.aluguelFixoSala*p.salas*(1-p.tCow/100))}</td><td>${pct(p.aluguelFixoSala*p.salas*(1-p.tCow/100)/Math.max(1,p.aluguel),0)}</td><td>${sgn(regime({...p, salasFixas:p.salas},p.modelo).resultado)}</td></tr>
    </table></div></div>`;

  // ----- Aba Caixa -----
  const years = {};
  s.rows.forEach(r => { const key = r.k ? "Ano "+(Math.floor((r.k-1)/12)+1) : "Obra"; (years[key] ||= {rec:0,res:0,cumS:0,alunos:0,n:0}); const y=years[key]; y.rec+=r.receita; y.res+=r.soc; y.cumS=r.cumSoc; y.n++; if(r.alunos!=null) y.alunos=r.alunos; });
  const caixa = `
    <div class="card"><h3>Ano a ano</h3><p class="sub">Contando a partir da assinatura do contrato. "Ano 1" começa na inauguração.</p><div class="scroll"><table>
      <tr><th>Período</th><th>Meses</th><th>Alunos no fim</th><th>Faturamento</th><th>Resultado</th><th>Caixa acumulado</th></tr>
      <tr class="sub"><td>Assinatura</td><td>—</td><td>—</td><td>—</td><td>${sgn(-s.upfront+p.empValor)}</td><td>${sgn(-s.upfront+p.empValor)}</td></tr>
      ${Object.entries(years).map(([k,y])=>`<tr><td>${k}</td><td>${y.n}</td><td>${k==="Obra"?"—":num(y.alunos)}</td><td>${brl(y.rec)}</td><td>${sgn(y.res)}</td><td>${sgn(y.cumS)}</td></tr>`).join("")}
      ${s.residual||s.caucaoVal?`<tr class="sub"><td>No fim: venda do negócio + caução devolvida</td><td></td><td></td><td></td><td>${sgn(s.residual+s.caucaoVal)}</td><td></td></tr>`:""}
    </table></div></div>
    <div class="card"><details><summary style="cursor:pointer;font-weight:650">Ver mês a mês</summary><div class="scroll" style="margin-top:8px"><table>
      <tr><th>Mês</th><th>Situação</th><th>Alunos</th><th>Faturamento</th><th>Resultado</th><th>Caixa acumulado</th></tr>
      ${s.rows.map(r=>`<tr${r.k&&r.k===s.payback?' class="hl"':''}><td>${r.m}</td><td>${r.fase}${r.k?" (mês "+r.k+")":""}</td><td>${r.alunos!=null?num(r.alunos):"—"}</td><td>${brl(r.receita)}</td><td>${sgn(r.soc)}</td><td>${sgn(r.cumSoc)}</td></tr>`).join("")}
    </table></div></details></div>`;

  // ----- Aba Como calculamos -----
  const como = `
    <div class="card"><h3>Glossário</h3><dl class="gloss">
      <dt>Ponto de equilíbrio (alunos para empatar)</dt><dd>Número de alunos em que o faturamento cobre exatamente todos os custos. Abaixo dele há prejuízo.</dd>
      <dt>Vagas no studio (lotação)</dt><dd>Quantos alunos ativos cabem, considerando horário, espaço, quantas vezes cada um treina e o vazio fora do pico.</dd>
      <dt>Dinheiro necessário</dt><dd>O pior saldo do caixa: obra, aparelhos e os prejuízos dos primeiros meses, antes de o negócio andar sozinho.</dd>
      <dt>Tempo para recuperar (payback)</dt><dd>Meses, a partir da inauguração, até o lucro acumulado devolver tudo o que foi investido.</dd>
      <dt>Valor do negócio hoje (VPL)</dt><dd>Todo o dinheiro que o negócio gera, trazido para valores de hoje usando o rendimento mínimo desejado. Positivo = rende mais que a aplicação alternativa.</dd>
      <dt>Rentabilidade anual (TIR)</dt><dd>Quanto o dinheiro investido rende por ano, em média. Compare com o rendimento mínimo desejado.</dd>
      <dt>Depreciação</dt><dd>Desgaste da obra e dos aparelhos ao longo dos anos. Não sai do caixa, mas reduz o lucro contábil.</dd>
      <dt>Rampa</dt><dd>Período em que os alunos e os aluguéis de sala crescem aos poucos até a meta.</dd>
    </dl></div>
    <div class="card"><h3>Fórmulas</h3><ul class="note" style="font-size:13.5px">
      <li>Horas abertas = (fecha − abre) × dias, somando semana, sábado e domingo.</li>
      <li>Alunos ao mesmo tempo: informado (recomendado 9). Área de treino necessária = alunos ao mesmo tempo × espaço por aluno; comparada com a área livre da planta.</li>
      <li>Balanço por área: custos do imóvel e custos comuns (recepção, limpeza, contas, sistema, contador, seguro, outros) divididos entre studio e salas pela área de cada andar; instrutores, aparelhos, divulgação e custos dos alunos ficam no studio; impostos, custos por hora e lixo hospitalar das salas ficam nas salas.</li>
      <li>Vagas = horas abertas × alunos ao mesmo tempo ÷ treinos por aluno × aproveitamento.</li>
      <li>Mensalidade média = soma de (preço × % dos alunos) × (1 − % plano longo × desconto) × (1 − não pagas).</li>
      <li>Instrutores = (horas abertas × instrutores + horas extras de pico) × custo da hora + adicional do RT.</li>
      <li>Salas: horas alugadas = horas disponíveis × ocupação; preço médio pondera pacote, avulsa e turno; sobra = receita − impostos − taxa do app − custo por hora.</li>
      <li>Alunos para empatar = (custos fixos − sobra das salas − outras receitas) ÷ quanto cada aluno deixa.</li>
      <li>Caixa mês a mês: alunos e ocupação crescem em linha reta até a meta; preços, custos e aluguel sobem a cada 12 meses; carência conta da assinatura.</li>
      <li>VPL e TIR usam o caixa do negócio sem o empréstimo; "dinheiro necessário" inclui o empréstimo.</li>
    </ul></div>
    <div class="card"><h3>Limites da simulação</h3><ul class="note" style="font-size:13.5px">
      <li>Durante a obra entram só aluguel (fora da carência), condomínio + IPTU, outras taxas do imóvel e garantia. Equipe, contas e sistema começam na inauguração.</li>
      <li>A meta de alunos não é limitada às vagas: se for maior, aparece um alerta, mas o cálculo usa a meta.</li>
      <li>Salas em contrato mensal fixo contam desde a inauguração; só a venda por hora cresce aos poucos.</li>
      <li>Impostos são percentuais fixos sobre o faturamento (Simples + cartão no studio; um percentual nas salas). IR/CSLL fora do Simples e a reforma tributária (CBS/IBS a partir de 2027) não estão modelados.</li>
      <li>"Lucro por mês" é sobra de caixa: inclui a parcela do financiamento ou do leasing dos aparelhos e não desconta depreciação (mostrada à parte).</li>
      <li>A caução volta no fim do período analisado; luvas não voltam. Sem valor de venda do negócio, salvo se informado.</li>
    </ul></div>`;

  LAST = {p:{...p}, s, verdictHTML: document.getElementById("verdict").innerHTML, bigsHTML: document.getElementById("bigs").innerHTML, resumo, lucro, riscos, comparar, caixa, como};
  document.getElementById("results").innerHTML =
    `<div class="tab" data-tab="resumo">${resumo}</div><div class="tab" data-tab="lucro">${lucro}</div><div class="tab" data-tab="riscos">${riscos}</div>
     <div class="tab" data-tab="comparar">${comparar}</div><div class="tab" data-tab="caixa">${caixa}</div><div class="tab" data-tab="como">${como}</div>`;
  showTab(UI.tab);
  bindChart(ch, s);
}

  UI.tab = t; saveUI();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab===t));
  document.querySelectorAll("#results .tab").forEach(d => d.classList.toggle("on", d.dataset.tab===t));
}

document.getElementById("btnReset").onclick = () => { if(confirm("Voltar todos os campos aos valores padrão?")){ P = {...DEFAULTS}; rerender(); } };

  const b = new Blob([JSON.stringify(P,null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "core-one-premissas.json"; a.click();

// ================= Exportar Simulação (PDF) =================
// Cores fixas do tema claro: o PDF sai sempre igual, mesmo com o site em modo escuro.
const LIGHT = {bg:"#ffffff", surface:"#ffffff", "surface-2":"#f1f0ea", text:"#12263f", muted:"#5b6676", border:"#dedcd3", brand:"#0b2636",
  accent:"#3f7f66", "accent-weak":"#e4efe9", gold:"#a08a5a", ok:"#2e7d4f", "ok-weak":"#e6f3eb", warn:"#9a6a00", "warn-weak":"#fdf4dc",
  bad:"#b3261e", "bad-weak":"#fbeae8", "chart-line":"#3f7f66", "chart-fill":"rgba(63,127,102,.12)", grid:"#e7e5dd", "s-in":"#2f8c64", "s-res":"#3f6fb5", "s-out":"#c0832a"};
const PDF_LIB = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
function loadScript(src){
  return new Promise((ok, fail) => {
    if(window.html2pdf) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("Falha ao carregar " + src));
    document.head.appendChild(s);
  });
}
function svgToPng(svg){
  return new Promise((ok, fail) => {
    let s = svg.replace(/var\(--([\w-]+)\)/g, (m,n) => LIGHT[n] || "#000")
      .replace(/<line id="cx"[^>]*\/>/, "").replace(/<circle id="cdot"[^>]*\/>/, "").replace(/<rect id="hit"[^>]*\/>/, "");
    const vb = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(s), w = +vb[1], h = +vb[2];
    s = s.replace("<svg ", `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" font-family="Segoe UI, Arial, sans-serif" `);
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = w*2; c.height = h*2; const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); ok({url:c.toDataURL("image/png"), w, h}); };
    img.onerror = () => fail(new Error("Falha ao converter gráfico"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
  });
}
async function svgsToImages(html){
  for(const sv of (html.match(/<svg[\s\S]*?<\/svg>/g) || [])){
    // largura/altura explícitas: a quebra de página precisa saber a altura antes de a imagem carregar
    const im = await svgToPng(sv);
    html = html.replace(sv, `<img src="${im.url}" width="${im.w}" height="${im.h}" style="width:100%;height:auto;aspect-ratio:${im.w}/${im.h};display:block">`);
  }
  return html;
}
function fmtVal(id, v){ if(id==="modelo") return MODELS[v]; return num(v, Math.abs(v%1)>1e-9 ? (Math.abs(v*100%1)>1e-9 ? 4 : 2) : 0); }
function premissasHTML(p){
  const eq = equipFields(p);
  return GROUPS.map(g => {
    const rows = g.f.filter(([id]) => g.id!=="equip" || id==="modelo" || eq.includes(id)).map(([id,l,u]) => {
      const ch = p[id]!==DEFAULTS[id];
      return `<tr${ch?' class="hl"':''}><td>${l}</td><td>${fmtVal(id,p[id])} ${u}</td><td>${ch?`alterado (padrão: ${fmtVal(id,DEFAULTS[id])})`:"padrão"}</td></tr>`;
    }).join("");
    return `<div class="card"><h3>${g.g}</h3><table><tr><th>Premissa</th><th>Valor usado</th><th>Situação</th></tr>${rows}</table></div>`;
  }).join("");
}
const REP_STYLE = `<style>
.rep{${Object.entries(LIGHT).map(([k,v])=>`--${k}:${v}`).join(";")};background:#fff;color:#12263f;width:calc(100% - 10px);padding:0;font:12.5px/1.4 "Segoe UI",Roboto,Arial,sans-serif}
.rep .scroll{overflow:visible}.rep table{font-size:11.5px}.rep th,.rep td{white-space:normal;padding:5px 6px}
.rep .card{padding:10px 12px;margin-bottom:10px}.rep .big .a{font-size:20px}.rep .hbar{grid-template-columns:170px 1fr 110px;font-size:11.5px}
.rep .ind .l{font-size:11.5px}.rep .ind .l small{font-size:10.5px}.rep .ind .v{font-size:11.5px}
.rep h2.sec{font-size:19px;margin:4px 0 12px;color:#0b2636;border-bottom:2px solid #3f7f66;padding-bottom:5px}
.rep .card{box-shadow:none}.rep .tip{display:none}
.rep .bigs{grid-template-columns:repeat(4,minmax(0,1fr))}
.rep .indgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.rep .cover{background:#0b2636;color:#fff;border-radius:14px;padding:18px 20px;display:flex;gap:18px;align-items:center;margin-bottom:14px}
.rep .cover img{height:78px;border-radius:10px}.rep .cover h1{margin:0;font-size:24px}.rep .cover p{margin:3px 0 0;color:#c8d3e0;font-size:13px}
</style>`;
function repSection(title, body){ return `<div class="rep">${REP_STYLE}${title?`<h2 class="sec">${title}</h2>`:""}${body}</div>`; }
// Monta as 7 seções do relatório (usadas no PDF e na versão para impressão)
async function buildSections(){
  if(!LAST) throw new Error("Sem simulação calculada");
  const L = LAST, p = L.p, agora = new Date();
  const quando = agora.toLocaleDateString("pt-BR") + " às " + agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const nAlt = Object.keys(DEFAULTS).filter(k => p[k]!==DEFAULTS[k]).length;
  const capa = `<div class="cover"><img src="${document.querySelector(".logo").src}" alt="Core One"><div><h1>Core One · Simulação de viabilidade</h1>
    <p>Studio de movimento + salas de atendimento · Rua Real Grandeza, 190 — Botafogo, Rio de Janeiro</p>
    <p>Gerado em ${quando} · ${nAlt ? nAlt + " premissa(s) diferente(s) do padrão (destacadas na seção 6)" : "premissas padrão"} · aparelhos: ${MODELS[p.modelo]}</p></div></div>
    ${L.verdictHTML}<div class="bigs">${L.bigsHTML}</div>
    <p class="note">Valores estimados a partir das premissas da seção 6. Não substituem orçamento de obra, parecer contábil ou validação da Vigilância Sanitária.</p>`;
  const resumo = (await svgsToImages(L.resumo)).replace(" Passe o mouse para ver cada mês.", "");
  const caixa = L.caixa.replace(/<details>/g,"<div>").replace(/<\/details>/g,"</div>").replace(/<summary[^>]*>[\s\S]*?<\/summary>/, "<h3>Mês a mês</h3>");
  const secoes = [
    repSection("", capa + resumo.replace(/^\s*/, "")),
    repSection("2. Lucro do mês", L.lucro),
    repSection("3. Riscos e cenários", L.riscos),
    repSection("4. Comparar opções", L.comparar),
    repSection("5. Caixa ao longo do tempo", caixa),
    repSection("6. Premissas usadas", `<p class="note" style="margin-bottom:10px">Linhas destacadas = valores alterados em relação ao padrão. Em "Aparelhos" aparecem só os campos da forma escolhida.</p>` + premissasHTML(p)),
    repSection("7. Como calculamos", L.como),
  ];
  return {secoes, agora, quando};
}
async function buildPdf(){
  const {secoes, agora, quando} = await buildSections();
  await loadScript(PDF_LIB);
  const opt = {
    margin:[10,8,14,8], filename:`core-one-simulacao-${agora.toISOString().slice(0,10)}.pdf`,
    image:{type:"jpeg", quality:0.95},
    html2canvas:{scale:2, backgroundColor:"#ffffff", scrollX:0, scrollY:0},
    jsPDF:{unit:"mm", format:"a4", orientation:"portrait"},
    pagebreak:{mode:["css","legacy"], avoid:["tr",".ind",".hbar",".alert","img",".chartbox",".card:has(.chartbox)",".big",".verdict","h3",".cover",".legend"]},
  };
  let w = html2pdf().set(opt).from(secoes[0]).toPdf();
  for(const sec of secoes.slice(1)) w = w.get("pdf").then(pdf => { pdf.addPage(); }).from(sec).toContainer().toCanvas().toPdf();
  // devolvido dentro de um objeto: o "worker" do html2pdf é thenable e seria consumido pelo await
  return {worker: w.get("pdf").then(pdf => {
    const n = pdf.internal.getNumberOfPages(), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
    for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(110); pdf.text(`Core One · Simulação de ${quando} · página ${i} de ${n}`, W/2, H-6, {align:"center"}); }
  })};
}
document.getElementById("btnPdf").onclick = async () => {
  const b = document.getElementById("btnPdf"), txt = b.textContent;
  b.disabled = true; b.textContent = "Gerando PDF…";
  try { const {worker} = await buildPdf(); await worker.save(); }
  catch(e){
    console.error(e);
    if(confirm("Não foi possível gerar o PDF direto (a biblioteca de PDF precisa de internet).\n\nAbrir a versão para impressão? Na janela que abrir, escolha \"Salvar como PDF\" como impressora.")){
      try { await printReport(); } catch(e2){ console.error(e2); alert("Também não foi possível abrir a impressão: " + e2.message); }
    }
  }
  finally { b.disabled = false; b.textContent = txt; }
};
// Alternativa sem internet: imprime o mesmo relatório por um iframe oculto (o navegador salva em PDF)
async function printReport(doPrint = true){
  const {secoes} = await buildSections();
  const css = document.querySelector("head style").outerHTML;
  const printCss = `<style>@page{size:A4;margin:10mm 8mm}html,body{background:#fff!important;margin:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}.rep{width:auto}.rep+.rep{break-before:page}
    tr,.ind,.hbar,.alert,img,.big,.verdict,.cover,h3,.card:has(.chartbox){break-inside:avoid}</style>`;
  const fr = document.createElement("iframe");
  fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(fr);
  const doc = fr.contentDocument;
  doc.open(); doc.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Core One — Simulação</title>${css}${printCss}</head><body>${secoes.join("")}</body></html>`); doc.close();
  await new Promise(r => setTimeout(r, 400));
  if(!doPrint) return fr; // usado só em testes
  fr.contentWindow.focus(); fr.contentWindow.print();
  setTimeout(() => fr.remove(), 60000);
}

document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();

  const f = e.target.files[0]; if(!f) return;

};
